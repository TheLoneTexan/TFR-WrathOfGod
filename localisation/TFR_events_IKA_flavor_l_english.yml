 IKA.31.t: "Jesus Loves You"
 IKA.31.d: "Those were the words hanging on a recruitment poster on the church door. One of the many that had been strewn around town as part of the recent recruitment drive, trying to expand the forces of the Army of God and it’s security wing the Guardians of the Faith.\n\nJosh wouldn’t normally pay it any mind. He was satisfied with his old job at the library. Unfortunately, that library was destroyed in an artillery barrage as the feds were evacuating from Lexington. Since then, he couldn’t find a job, he was running out of savings, and could no longer pay his bills.\n\nHe stood there for a minute, wondering if it’d really be worth it, becoming a soldier. He’d never considered himself the fighter type, but why couldn’t he be? It called upon the poor, needy, and faithful, and he was certainly all of those things, so maybe it wasn’t going to be so bad. Sure, it was dangerous, but so is being homeless, and at least he’ll have everything he needs if he joins the force.\n\nAfter the service, he drives to the recently set up conscription office. There was a long line of people, many of whom Josh recognized as part of the growing homeless population. After about 30 minutes of silently standing in line, he made it to the front.\n\nThe man at the front, barely looking at him, said, “Name, age, duration of unemployment.”\n\n“Joshua Evans, 23, and about 4 months, I think.”\n\nThe man handed Josh a small card and a paycheck before saying, “This card is your ID number. Arrive at the printed address on Wednesday by 8am sharp. Got it? Next!”\n\nAs Josh walked away, he looked down at his paycheck, the first he’s had in months. 600 dollars. Maybe the life of a soldier isn’t that bad."
 IKA.31.a: "God always provides for his children."
 IKA.32.t: "Church Report from New Dawn Ministries"
 IKA.32.d: "To: HIGH REVEREND DONALD SPITZ\n\nFrom: New Dawn Ministries and Guardians of the Faith\n\nSubject: Report on the Status of Christian Churches\n\nAs the official ministry for American Christianity, it is the goal of New Dawn Ministries to ensure that every Christian church in America is faithful and true to the precepts of the Holy Bible and the Apostolic Law. Additionally, we oversee the conversion or closure of any heretical churches that spread false dogmas and beliefs about the Lord and Christ, in cooperation with the Guardians of the Faith.\n\nRegarding our efforts, I can happily report that many Christian churches within our territory have fallen in line with our will. The most conservative churches, namely Presbyterians, Baptists, Lutherans, Pentecostals, Anglicans, and, have more or less acceded to the official doctrine. Likewise, many Catholic, Orthodox and Mormon churches have largely chosen to comply with our godly system of rule for common goals and special protection. Some churches however have proven more resistant to accepting the true version of the Holy Bible and the Apostolic Law and have sought to undermine our conversion efforts by spreading false dogmas or messages to the Christian public. These churches include Episcopolitans, Methodists, Jehovah’s Witnesses and treasonous so-called “Baptists” and “Lutherans.” New Dawn and the Guardians have dealt with these blasphemers by sacking their clergymen off to the conversion camps and shutting down or converting these liberal churches. In such cases, we cleanse our sacred churches of blasphemous false prophets and put wayward churches into true beacons of faith.\n\nOn the issue of conversion, New Dawn Ministries and the Guardians of the Faith have made great strides towards converting faithful and even some wayward Christians to our cause. The new converts are eager and willing to spread the word of God and evangelize their brethren under the stewardship of New Dawn Ministries. For the wayward, some have seen the light and chosen to join the cause while others stubbornly refuse and have since been subjected to our lessons at the conversion camps with the assistance of the Guardians. It is with pleasure to note that most of our conversion efforts for individual Christians have been a success. More and more Christians within our lands have embraced the Army of God and the High Reverend as the protectors of American Christianity, the heralds of a new holy era. Though we’ve encountered some troubles and resistance, it has been quickly dealt with.\n\nAnd for the churches, many adhere to the Apostolic Law and your sermons. They are staffed with devout and fervently loyal clergymen who actively preach the true doctrines of American Christianity and spread the good news of our accomplishments. They are the incubators for the next generation of American Christians and members of New Dawn. The rebellious, false churches operating within our territory have since been shut down or repurposed with the Guardians successfully putting down these blasphemous impostors, particularly the remnants of the communist Redneck Revolt. So far, the Christian churches in our territory are mostly loyal and devoted to us.\n\nWhatever challenges arise, I can assure that New Dawn Ministries and the Guardians of the Faith shall overcome these challenges with the blessing of our Almighty God, including the false liberal churches."
 IKA.32.a: "Signed: A Missionary from New Dawn Ministries and the Guardians of the Faith."
 IKA.33.t: "The New American School Curriculum"
 IKA.33.d: "Simon was, like most Americans his age, born into a Christian family but was not particularly devout or zealous and simply observed holidays and other traditions on a cultural basis. This also extended to his days at high school before the war, which were mostly free of anything particularly religious. But since the Army of God took over, Simon began to notice the many changes to St. Gabriel High School: Banners sprouted across the facility, lessons on sex education was cancelled, the Pride Club was disbanded, the Flag and Pledge and old basketball court were covered in pithy Biblical slogans, and in the centre of the school assembly-yard a giant tarp, its red font almost childlike in its baldness.\n\nWHEREFORE COME OUT FROM AMONGST THEM, AND BE YE SEPARATE, SAITH THE LORD, AND TOUCH NOT THE UNCLEAN THING; AND I WILL RECEIVE YOU. 2 CORINTHIANS 6:17\n\nSimon had never been one for the staid Masses and the slap-on-the-hand nuns that passed for schoolteachers, but the glaring red font of the new banners felt sinister in a way old Mother Superior had never successfully mustered. From the whispers of what was left of the student body, his classmates had felt the same way.\n\nThe first 'lesson', if it could be called that, did not improve the mood. Gone were the reassuring whispers and murmurs of the Marian Devotion; in its place, a school prayer was observed with every student (Simon included) required to perform it, led by a hawk-eyed schoolteacher named Martha. Oh, the students had chuckled and murmured through the first half a minute - then Martha nodded to a grim-faced militiaman outside the door, and at once three of Simon's classmates were dragged from their seats out of class.\n\n“I expect every single one of you to be a God-fearing patriot in service of our country,” Martha reminded her students. “Anyone who shows the slightest bit of treason shall be met with fierce and just vigilance.”\n\nAfter the stern reminder, the next lesson was an hour-long lecture on how America was designed as a Christian nation with Martha citing early history, texts like the Mayflower Compact and Declaration of Independence and statements from the Founding Fathers to support the idea of theocratic republicanism wrapped in red, white and blue. The subsequent lessons kept up the anodyne tone - one could only use such titles as \"The Expulsion of the Demonic Homosexual Curricula,” \"The Biblical Truth Against Liberal Evolution Agendas,” “Cultural Marxist Infiltration of American Society,” and “The Fight Against Islamic Radicalism,” in so many variations, after all - but the unhurried thumps and muffled screams kept the class silent. As the students streamed in, faces bloodied and teeth askew, the class of St. Gabriel looked away as one. All were silent. Simon’s mind was now echoing with the thought:"
 IKA.33.a: "God's new Shepherds were here, and the Rod and Staff were their comforters now."
 IKA.34.t: "A Muslim in Christian America"
 IKA.34.d: "For Ahmed Alizai, life in America was one of tolerance and conflict. A Muslim man of Pashtun descent born in Afghanistan, he would choose to immigrate to the Land of the Free in search of a better life amidst the chaos and the Taliban’s repression in his homeland in the years leading up to the War on Terror. Since then, Ahmed had integrated fairly well into the American way of life, raised a family consisting of his wife Fatima, his older son and his younger daughter. He secured a steady job as a convenience store clerk eagerly serving his community in the city of Atlanta for both Muslims and non-Muslims alike.\n\nFor years, non-Muslim customers would approach him to ask for advice on the best items at the convenience store and even hold friendly conversations from time to time. Sure, not everyone was welcoming and friendly towards him and there were definitely bigots who despised Muslims but they were the exceptions rather than the rule and life seemed to be going well for the most part.\n\nBut those times were long since past.\n\nSince the outbreak of the Second American Civil War, the Christian extremist group Army of God had taken control over the entirety of Georgia and the Carolinas including the city of Atlanta and oversaw a process of legal discrimination against Muslims in the public space. Recently, the Shea administration has begun proposing new policies like banning the hijab, restricting the construction of new mosques and prohibiting Muslims from converting non-Muslims. The media was now preaching hateful anti-Muslim propaganda, portraying Islam as the enemy of Western civilization and the United States of America, inherently linking it to traumatic events like September 11th and the War on Terror.\n\nEven some of Ahmed‘s own customers and neighbors had fallen sway to the AOG’s media apparatus and were becoming hostile to him and his family just for being Muslim. His family’s Afghan heritage now made them the targets of hatred and ridicule by Christian citizens who associated the family with the failed war in Afghanistan and the Taliban, despite their support for the democratic government and firm opposition to the Taliban themselves. Now, Ahmed was seeing the same radical fundamentalism playing out in his adopted home country, no less. Ahmed‘s son and daughter were facing discrimination at school, his wife had been insulted and verbally harassed by onlookers and there were fewer and fewer friendly customers he could talk to.\n\nAs Ahmed was sitting in his home with his wife and children after the shift, they would turn on the television to see a broadcast of an anti-Muslim rally organized by a Southern Baptist pastor with a crowd numbering in the thousands. Like the Islamophobic demonstrations pre-war, this rally was a demonstration dedicated to denouncing the basic tenets of Islam, Prophet Muhammad and so-called “Islamists” (clearly referring to most Muslims in general). The attendees had strips of pork bacon on their clothes slathered with sauce, drank wine and made anti-Islamic chants, followed by the Pastor taking out the Quran to desecrate it.\n\nOn the television screen, Ahmed and the family would see such blasphemous events unfold.\n\n“The Muslims shall know our holy fury for launching terrorist attacks against innocent Christians, secretly working to implement Sharia law and trying to achieve the Islamization of America. From this day forth, we shall no longer tolerate such subversion within our borders.”\n\nAfter making the announcement, the pastor would then pull out a lighter and put the Quran on fire to burn to ashes. The Alizais were distressed at such a disturbing sight. To see one of the holiest books from God himself burned and desecrated was nothing short of hate. And the worst part is that the government was encouraging such hate in the public space.\n\n“Our own government is now encouraging the burnings of Allah’s holy book,” said Fatima. “It is disheartening to see such blind prejudices are being spread across the country,” remarked Ahmed. “But there’s little we can do but resist in secret.”"
 IKA.34.a: "A stranger in his own homeland"
 IKA.35.t: "Homosexuals and the American Government"
 IKA.35.d: "Today, President Matt Shea of the Army of God has made an important announcement regarding the sin of sodomy.\n\nWhile the holy armies of God have done much to save the United States from sin, the crime of Sodom still threatens our Christian democracy. It is clear that the unholy act of homosexuality is a disease to any holy and democratic nation, as evident by the decline of the United States and the Christian West. However, God, as a loving and compassionate being, we are to hate sin; not sinners.\n\nSince our nation’s founding, the sin of sodomy has been banned in virtually every state in the Union up until recently where it was legalized in the courts thanks to the radical Cultural Marxist revolutions of the 1960s and beyond. Many American Christians consider homosexuality to be abhorrent and a sign of moral decay. For too long this sin has been tolerated and promoted by the liberal media and academia. But no longer will sodomy be tolerated in our borders. As such, all forms of sodomy namely bars, prides, drag shows, transgender surgery and homosexual media are prohibited in the United States of America once more.\n\nThe plague of sodomy cannot be destroyed by brutish violence, but only by the love of Christ. Those afflicted by homosexuality and gender delusion are not demons to be exorcised, but men and women who have fallen from God’s path. The willing may join us as friends, so long as he/she swear to turn their backs on the practice of sodomy. The unwilling, like all heretics, will remain as he/she is now. Those who refuse salvation will continue to have no place in the Republic of Believers.\n\nEffective immediately, those who wish to be cured of sodomy only need to go to his/her local church, where he/she will fill out a form renouncing his/her old sinful ways and reporting other homosexuals in need of salvation. He/she will then be relocated to their nearest conversion camp, where they may at last be cured."
 IKA.35.a: "God loves you!"
 IKA.36.t: "Official Program from the Christian Broadcasting Network"
 IKA.36.d: "Established in 1960 by televangelist Pat Robertson, the Christian Broadcasting Network or the CBN has for decades served as the voice of God and of American Christians throughout the United States since it’s inception. The CBN was one of the arbiters of holy truth in a sea of sin as it presented news and entertainment through a patriotic, biblical worldview. CBN was best known for it’s long-running news program The 700 Club and the anime franchise Superbook among other such programs.\n\nEven in the darkest of days, CBN continued to present the holy truth to Christian viewers seemingly on the path. When the Second American Civil War had broken out, CBN was plunged into chaos as the network’s staff were dealing with the unfortunate reality of Americans fighting one another. And the network’s state of Virginia was under the control of the liberal Union of America in Washington DC, prompting the network to flee to more friendly areas within the Bible with a seemingly uncertain future. Luckily for CBN, a salvation arrived in the form of the Army of God after it’s unification of the Southeast. The Army of God under the leadership of President Shea shared the CBN’s patriotic, biblical worldview and was eager to utilize America’s #1 Christian media company for the cause.\n\nNow, the CBN has become the official news service and network for the ever-patriotic Army of God. Like before, the CBN would serve as the arbiter of holy truth with it’s Christian-made news and entertainment. This time, however, the CBN would be a state-controlled broadcasting service supported by not just viewers’ donations but the Shea administration and would be able to strongly influence the minds of many American Christians. The newly-nationalized CBN would be the official broadcasting arm of the reborn United States.\n\nInside the CBN’s new headquarters in Atlanta, the newsroom was abuzz with activity as everyone from the editor-in-chief to the producers and reporters were working to present the latest news report from The 700 Club, produce the next episode for Superbook and collect the most up-to-date information. Today’s program was a report on President Shea’s latest speech on the restoration of the United States as a  Christian society. This was to be a historic milestone for the Shea administration as it would reveal the progress made on live television no less and the CBN would be the main outlet. As the newsroom was lit with various programs on the screens, President Shea’s speech began to be played with everyone paying attention to it. The CBN then broadcasted a report on President Shea’s speech with a female news anchor in the interior.\n\n“Good evening, this is the Christian Broadcasting Network, the official Christian news and radio service of the United States. I’m Sally Bradford, bringing you the latest patriotic, biblical news. Today, we are presenting the latest report on President Matt Shea’s speech on the re-establishment of the United States as a Christian society and the progress being made towards this goal. Shea has recently visited the North Point Community Church to outline a vision of a renewed Christian America to the attendees with significant applause.”\n\nAfter the news anchor continued, she made more remarks about the speech.\n\n“The speech represents a godly vision to save our country from decadence and sin and to reinstill the Judeo-Christian values the United States was built on. Here are some excerpts of the speech from our crew.” After Sally outlined the basic details of President Shea’s speech, the report then transitioned to the speech proper.\n\n“My fellow Americans, we have made significant strides towards restoring the Judeo-Christian foundations which the United States was built upon; Over the past few months, we have reinstated prayer in schools, promoted Christian patriotic education, protected traditional marriage and norms, outlawed homosexual propaganda and have taken actions against the Islamists and radical leftists within our borders. We have also made sure that the Constitution as it was intended to be is applied correctly and that Biblical Law is upheld in every aspect of our day-to-day lives…Our administration has provided significant economic aid and relief to the devastated Christian communities of the Bible Belt and re-established business and commerce free from the communist tyranny of Redneck Revolt…Peace and tranquility is assured through our Guardians of the Faith…God, Country, Family are the essential pillars for what the United States shall be…Soon, the United States of America will be restored as one nation under God indivisible with liberty and justice for the faithful”\n\nA loud, sumptuous applause was recorded in the church and presented in the report as proof of the Shea administration’s success in establishing this “Christian society” for America. Whatever the case, the speech made an impact particularly among Christian nationalists within the Army of God."
 IKA.36.a: "America shall know God and patriotism once more"
 IKA.37.t: "A Gathering of American Christians"
 IKA.37.d: "As the morning light shone into Atlanta’s Church of the Redeemer, Matt Shea stood at the pulpit, reveling in the morning light. Before him, in the pews, sat 12 men, each respected members of their denominational community with political experience and legal or military expertise. After allowing them a few minutes to exchange pleasantries and get comfortable, the President would finally speak.\n\n“Brothers, we are here today because America is a beautiful thing. Since the Pilgrims’ arrival in 1620, it was a place where all men could worship God as they pleased.” A sudden “Amen!” erupted from Grady Thomas, the Black elder of the Baptists. “Unfortunately, democracy and the American Dream was an unguided flock. Look around! See how it has fallen into sin and death without the Lord’s guidance!”\n\nThe group roared in agreement, with the Orthodox priest, Theodore Kolas, listing the decadence he witnessed firsthand amongst the jeers.\n\n“Today, however, America shall be made new, just as Christ said long ago! We will revive the Pilgrims and Patriots’ ambition of a holy nation, and ensure it never falls into the hands of sin again!”\n\nSamuel Ramirez, the Hispanic Catholic priest, shouted over the crowd, \"But how? Won’t we, in our sinful nature, always fall?”\n\n“I was just getting to that,” Shea smirked, “You will be the elders of the people; the Council of Elders, those who hold the spiritual wisdom to guide them towards the light. Besides myself, you hold the final say on all legislation. When the people err towards sin, you, the council, can strike it down before it can fester further.”\n\n“Yes, that’s all well and good,” said Donald Spitz, a long-time veteran of the Army of God, “but what of those with more… peculiar views of God?” shooting a glance towards the Mormon elder Ammon Bundy.\n\n“While yes, it isn’t as cohesive per se, if we don’t accept our differences, we ostracize our brothers! Such a division risks destroying us once again!” Shea retorts, directing the crowd’s gaze to the smoke still rising from the Georgia State Capitol.\n\nAfter a few moments with no further comments, the President declared, “Now then, let’s get to work.”"
 IKA.37.a: "Letting the sheepdogs loose"
 IKA.38.t: "The Patriot Church"
 IKA.38.d: "On this day, a ground-breaking ceremony would be held for the construction of New Salvation Patriot Church by New Dawn Ministries. The ceremony’s attendees included prominent clergymen from New Dawn, local officials and congregants and was met with much fanfare. The church also comes equipped with daycare, classrooms and other such facilities to serve our community. New Salvation Patriot Church was paid by and for the American government as an act of God to the people.\n\nNew Salvation represents a new kind of American Christian church in the making: the Patriot Church. A Patriot Church is a church that is focused on teaching both Christianity and American patriotism with the backing of both New Dawn Ministries and the American government. That is to say, the Patriot Church is a place of worship and patriotic learning. Every faithful church shall be a Patriot Church and teach the righteous principles of Christianity and Americanism throughout the country.\n\nIn a Patriot Church, loyal clergymen will teach not only the Holy Bible but will also teach some of our nation’s most important texts such as the Mayflower Compact, the Declaration of Independence, the Constitution and Gettysburg Address. The church shall be adorned with Christian and patriotic imagery such as use of Old Glory and the Christian flag. Most importantly, the religion of the Patriot Church and the United States as a whole is American Christianity, a synthesis of Christianity and American patriotism encompassing a broad spectrum of faith-minded Christians across various denominations namely Protestants, Catholics, Mormons and Orthodox. The Patriot Church is the next step in protecting both our nation and Christendom.\n\nIt is not a coincidence that our Pilgrim and Patriot forefathers perfectly understood that Christian values are the key to a successful nation. They prayed at churches or other such places, asking for God’s mercy or grace even in the darkest hour. They knew from such experiences that Christian values are important to their community or nation. The Patriot Church is simply the continuation of what our forefathers intended.\n\nFrom Christianity’s very inception, the church has served as an important place for religious instruction and education. This is especially true of the United States and most Christian countries historically speaking but sadly the decline of Christianity saw many churches demolished or converted for other purposes. But here, the Patriot Church will not just remind the world of the importance of the church but to unify American Christendom for a renewed purpose."
 IKA.38.a: "Of all the dispositions and habits which lead to political prosperity, religion and morality are indispensable supports."
 IKA.39.t: "The Beginnings of a Holy Kingdom"
 IKA.39.d: "Traditionally, the stage of the First Baptist Atlanta Church would be a brilliant lightshow. A sight truly worthy to worship the Almighty. However, today was not a day to dazzle both God and an audience. No, today the stage was Steven Anderson’s mount, where he will give his sermon on the future of God’s holy kingdom. Alongside him are the Council of Disciples, the most fanatical loyalists of Anderson’s new government.\n\nWhen his disciples finally arrived, he announced, “Welcome, brothers! We have much to do today,” he quickly scrolled through the notes on his laptop, “so how about we cut to the chase?”\n\n“Well, given your recent proclamations, there’s been an influx of true Christian men wanting to join the ministry,” noted one of the disciples.\n\n“Very good! Of course, we must ensure their loyalty, but once they prove themselves, grant them immediate state positions. Speaking of which, have the other churches renounced their heretical teachings?”\n\nA different disciple said, “Yes sir, many of the old Baptist churches have accepted your canonical authority. Unfortunately, the police report that many more churches continue to stick to their heretical teachings.”\n\n“Tragic. Well, we know what must be done. Make the loyal churches the center of local authority, burn the old town halls, and if none of that changes their minds, I declare that we burn down those disloyal churches as well.”\n\nThe disciples politely clapped before voting on Anderson’s declaration. All in favor, exactly as intended.\n\n“Next, the Bible. The King James Bible must be the supreme law of the land and the only true interpretation of the Bible allowed. In other words, put the women in their place, kill the gays, purge the sinners, et cetera et cetera…”\n\nThe same again. A polite clap, a unanimous vote, and the word became law.\n\n“And lastly,” Anderson said, “the order of the church. It is time we end the perversion of the church, and bring it back to its roots!” The disciples cheered. “We are the only ones who can be trusted to guide the church in the right direction as envisioned by St. Paul and the original disciples of the 1st Century AD! Only when the church returns to its holy roots shall America receive a true redemption!”\n\nApplause, approval, law. The cycle continues once more."
 IKA.39.a: "Only through blood can we be redeemed."
 IKA.40.t: "Anderson’s Justice"
 IKA.40.d: "Jackie was pushed into the courtroom. It was clear that it had been purged of the old American iconography, lazily replaced with Christian ones. The judge, old and visibly irritated, sat beneath a large crucifix. From where she stood, she could’ve sworn that Christ hanging from its beams was sadly staring at her.\n\nPlaced at the center of the courtroom, she began to look around.\n\n“W-wait a minute, where’s my lawy-”\n\n“Jacqueline Robertson,” boomed the Redeemer judge, “You are here on account of your crimes against God, primarily your criticisms of Pastor Anderson’s holy mandates and your past support for Matt Shea’s crypto-secularism.”\n\nJackie was taken aback. “What? No! I’ve been a Christ-”\n\n“Silence! There will be order! Now, will the prosecution speak?”\n\n“Yes, your honor. Before the internet shutdown, the defendant was found praising Shea’s ‘true patriotism’, and accusing Anderson of being ‘unchristian’.” The prosecutor glared at Jackie, as though he was personally offended by the comments.\n\nShe sat there quietly for the next hour as the prosecutor brought in more “evidence”. Her protests, her English Standard Bible, the feminist book that she hadn’t read in years, the science textbook she bought for her son, each more innocuous than the last. Yet, somehow, the jury seemed to stare at her with greater contempt.\n\n“The prosecution rests.”\n\nThe words knocked Jackie out of her stupor, and she began to look pleadingly to the jury. It was then when she noticed not a single woman sat amongst them.\n\nThe judge asked, “Members of the jury, have you reached a decision?”\n\nThey looked at each other, mumbling and nodding, before the oldest of the jurors declared, “Guilty”.\n\n“Then, for the crimes of treason and heresy, I sentence Jacquelin Robinson to death by stoning. Guards, send her away.”\n\nJackie could hardly speak nor resist as she was dragged away from the courtroom. As she was brought to the door, the only words she could muster were, “Forgive me...”"
 IKA.40.a: "No mercy for the heathens."
 IKA.41.t: "Attacks Against Unbelievers"
 IKA.41.d: "“We’re here.”\n\nDavid and his unit jumped out of the armored car, placed just outside the parking lot of the Islamic Center of Savannah. It didn’t take long for him to realize why he had been called there. Most of the building’s windows were boarded up, while the front door was barricaded by one of the member’s trucks. Other GoF vehicles surrounded the building, guns drawn at the windows. Since Steven Anderson’s election as leader of the Army of God, he had issued a sermon edict officially banning all so-called “heretical” religions and denominations within Army territory and this extended to public worship. David and his GoF unit would not hesitate in carrying out such orders.\n\nHe ran over to one of the other units and asked, “What’s the situation?”\n\n“Lieutenant Thompson,” Officer Davis saluted, “the congregation has been holed up here for about a day now. They’re demanding we let them worship freely. Same excuses as the Catholics. We’ve already tried to force ourselves in, but they’re too heavily armed.”\n\n“Like the synagogue in Augusta? Unacceptable. How many are inside?”\n\n“A little over 40. Most seem to be fighting aged men, but some families are also seeking refuge.”\n\n“Have you tried to lure them out with tear gas?”\n\n“Tear gas, smoke bombs, everything short of burning it to the ground. They’re stubborn.”\n\n“It seems clear what we must do, then. Have you heard what our brothers in Raleigh did to that Hindu temple?\"\n\n“Yeah, they burned it down. Are you saying we do the same? What about the people inside?!”\n\n“They already had their chance at mercy.” He then made his request to command before turning back to Officer Davis. \"Don't let anyone out.\""
 IKA.41.a: "Operational Success. Praise be to God."
 IKA.42.t: "New Documentary Released: ‘America’s Redemption’"
 IKA.42.d: "A new documentary film by Burning Bush Productions has hit the airwaves of the Redemption Government, providing something new to intersperse Anderson’s sermons, and the rather dull state-approved media.\n\nThe first part of the documentary focuses on the reasons for the Second American Civil War, blaming the rise of sexual deviancy, Jewish influence, and mob rule. It draws heavily from Anderson’s previous works: Marching to Zion and Babylon USA, the latter of which is directly referenced throughout.\n\nThe second portion focuses on the present, specifically Anderson’s efforts to redeem the country. Bible verses, sermons, and biblical scholars are used to justify the actions of the divine regency. It also rebukes the many condemnations from organizations abroad, including the Pope’s criticism of the regime.\n\nThe documentary concludes with a hopeful message from Steven Anderson himself, saying “Redemption’s road is long and narrow, but so long as we continue to follow it as we have, God will be with us”.\n\nThe documentary has been praised within the Redemption Government as a masterwork. Beyond its borders, however, it’s been criticized as “blatant propaganda”, “antisemetic”, and “poorly researched”. Anderson has ignored these criticisms, simply thanking Burning Bush Productions for their “wonderful work” and that it will serve as a major step towards the development of New IFB-approved “soul-winning entertainment.”"
 IKA.42.a: "God's work is beautiful."
