l_english:
 #Initial Focus Tree
 IKA_babylon_has_fallen: "Babylon Has Fallen"
 IKA_babylon_has_fallen_desc: "America, the new Babylon, has finally fallen. As the country is engulfed by it's second civil war, a golden opportunity has arisen for us to truly bring about the return of God and Jesus Christ to this forsaken land. For decades, true-born Christians have been oppressed by the tyrannical government in Washington, without genuine representation and betrayed by corrupt bureaucrats on both sides. Only the Army of God saw through this facade and served as the protectors of both Christians and the unborn. With the tyrannical government in complete collapse, now is the time to create a truly holy society from the ruins of the old."
 IKA_the_red_devil: "The Red Devil"
 IKA_the_red_devil_desc: "Communism. From its inception, Communism is a godless, atheistic ideology responsible for countless crimes against Christians in the USSR, China and other such places. Most disturbing of all, there are some Americans who seek to reintroduce this ideology, even going as far as to pervert the ideals of the Lord and Christ to justify their goals. These Americans include members of Redneck Revolt, a recently re-established Marxist gun club using the guise of “anti-racism” and “anti-fascism” to spread Communism. Thus, we must destroy them before they can bring about the Red Terror."
 IKA_the_servants_of_babylon: "The Servants of Babylon"
 IKA_the_servants_of_babylon_desc: "Long ago, the United States of America was a nation with true-born believers who contributed to its very foundations and spread the word of God to millions. Sadly, these foundations are gone as the nation now murders unborn children and preaches sodomy and feminism. Anyone helping the satanic Biden administration is just as complicit in the moral and spiritual decay of America as the communists. This includes not only Roy Cooper's Southern Federal Command but also Governors Brian Kemp and Henry McMaster. These men and women are the harbingers of misfortune and sin. Thus, it is absolutely necessary to rid America of these servants of Babylon."
 IKA_finding_the_faithful: "Finding the Faithful"
 IKA_finding_the_faithful_desc: "It is no secret that America is the bastion of Christianity, with the largest population of Christians worldwide. Naturally, this includes sympathizers and supporters from various Christian churches and communities, especially those found in the Bible Belt. They come to our cause in droves. Like how God searched for righteous people in Sodom and Gomorrah, we'll look for them in Atlanta and Charleston."
 IKA_walls_of_jericho: "Walls of Jericho"
 IKA_walls_of_jericho_desc: "In biblical times, the Walls of Jericho fell when the Israelites marched around the walls seven times and shouted. The civilization of Canaan and its King were met with God's righteous fury. As the modern-day successors to the Israelites, the same shall happen here. Atlanta will fall while we sing hymns to God and Jesus Christ."
 IKA_guardians_of_the_faith: "The Guardians of the Faith"
 IKA_guardians_of_the_faith_desc: "Satan's forces have historically targeted Christian communities and have infiltrated them with decadent, liberal ideas such as the acceptance of homosexuality, female pastors and race hustling. It's no surprise that American Christianity has been on the decline as more and more Christians are accepting liberal ideas or turning away from the church. To say nothing of the many sinners and pagans that exist. We cannot continue to tolerate this kind of behavior and a course correction is needed to rectify these troubles. Henceforth, we shall establish a new kind of security agency in America known simply as the Guardians of the Faith, which will bring these fake Christians and sinners to judgment."
 IKA_open_the_conversion_camps: "Open the Conversion Camps"
 IKA_open_the_conversion_camps_desc: "Conversion therapy is a medical doctrine historically used to overcome the sin of homosexuality through every possible means necessary. Christian organizations and the like have used it to cure people of the homosexual disease, only for the Washington government and others to clamp down on this legitimate practice, even as Christians continue it in secret. The unfortunate consequences of such bans include the acceptance and promotion of sodomy to the public. Thankfully, conversion therapy shall be reintroduced through our newly-created conversion camps to serve as a field mission and a place of penance for the sinful."
 IKA_valley_of_death: "Through the Valley of Death"
 IKA_valley_of_death_desc: "We are pinned in the mountains, surrounded by enemies on all sides. It is a holy struggle against Babylon's servants that began in the Southern Appalachians. As soldiers of Christ, we are training our recruits and veterans to properly engage the Federal forces in battle. This experience and discipline will give our soldiers the necessary tools and methods to vanquish this satanic threat."
 IKA_we_shall_not_fear: "We Shall Not Fear"
 IKA_we_shall_not_fear_desc: "God is our refuge and strength. Jesus is our Savior. We shall overcome. Those who die for His cause are assured a place in Heaven."
 IKA_chariots_of_iron: "Chariots of Iron"
 IKA_chariots_of_iron_desc: "Much like the iron chariots used in the past, the tanks of today are the armored guards of the world's top fighting forces and the Army of God is no exception. They are mighty machines of war that bring destruction in their wake and dominate modern battlefields alongside the jets. Every other faction in the Second American Civil War uses them. Thanks to our connections within the military, we will acquire some tanks from a nearby army base for our use."
 IKA_show_them_his_truth: "Show Them His Truth"
 IKA_show_them_his_truth_desc: "We must show our skeptics the truth of Jesus's divinity and his sacrifice for their sins. Too many Americans are being led astray by false prophets and propagandists who spread a distorted view of the situation. However, we can show them the light through the word of God. Service in the Army is the first step. Thus, they must be encouraged to join our cause for forgiveness."
 IKA_servants_of_molech: "Cast Out the Servants of Molech"
 IKA_servants_of_molech_desc: "Abortion, homosexuality, transgenderism and liberalism are all disgusting sins in the modern world and little more than annual rituals for the satanic government, much like how Moloch was the pagan god the Kingdom of Israel sacrificed babies to. It is shameful to see these practices become so commonplace in America. And our enemies have the backing of the satanic government and its collaborators. As such, all who participate in the rituals themselves deserve the same punishment that they would get for murdering and brainwashing our children."
 IKA_the_greater_evil: "The Greater Evil"
 IKA_the_greater_evil_desc: "The United States of America is unique in that it was a nation founded by and for Christians who believed that biblical values were the key to civic participation, and later served as a bulwark against Communism during the Cold War. While the current government is undoubtedly evil, the communists support all the sins of theirs and are substantially worse as they wish to replace God with Karl Marx and Christianity with their twisted atheist belief system in an effort to destroy our country. More importantly, many American Christians see the United States itself as God's nation and choose to fight for their Creator under its banner. With the U.S.'s fate at stake, it would be wise of us to take up the mantle of the protectors of the American Dream to liberate it from sin."
 IKA_rejecting_satan: "Rejecting Satan"
 IKA_rejecting_satan_desc: "The United States may be nostalgic and beloved, but it was never truly Christian. It was, after all, the same nation that took the church away from the state and was created by heretical Freemasons to subvert God's will through secularism. Centuries later, this same nation has overseen the rise of sodomy, abortion, feminism and other earthly sins, clearly the result of the secular system established by these Freemasons. Recently, a growing number of Christians have come to the conclusion that the U.S. is beyond saving and should be torn down entirely in favor of something new. We must destroy this mortal creation to replace it with a purer, more godly one."
 IKA_baptism_by_fire: "Baptism by Fire"
 IKA_baptism_by_fire_desc: "We are learning while we are fighting. As bullets rain over us, we grow stronger and more resilient. We are becoming unstoppable. It is, as some might say, a baptism born in the fires of war."
 IKA_equal_under_god_not_man: "Equal Under God, Not Man"
 IKA_equal_under_god_not_man_desc: "We are all created equal in the eyes of God and His law. However, this does not mean we are to be literally equal in everything. Instead, true equality comes from faith. Money is temporary, but Heaven is forever."
 IKA_holy_minutemen: "The Holy Minutemen"
 IKA_holy_minutemen_desc: "With faith in his heart and a gun in his hand, the Minuteman asks for nothing but the freedom of his soul and those of his countrymen. He is no terrorist or insurrectionist but a citizen deeply concerned for the well-being and prosperity of his people and his land. He is fighting for a nation truly blessed by God with liberty and justice for the true-born believers. Like the Patriots of old, he seeks to free them from servitude, whether to an overseas empire or Satan himself."
 IKA_servants_of_mammon: "Servants of Mammon"
 IKA_servants_of_mammon_desc: "The love of money is the root of all evil and you cannot serve God and money. The wealthy were the biggest advocates of sinful indulgence and provided substantial support for the sins of today. But now, their federally-backed networks are vulnerable to the effects of war. As punishment, they will be sent to the camps and their assets seized for Jesus."
 IKA_god_hate_gays: "God Hates Gays"
 IKA_god_hate_gays_desc: "While the Westboro Baptist Church is a strange and hermetic cult run by the Phelps family, their protests proved true that the legalization of homosexuality made America fall like Rome before it or Sodom and Gomorrah. Homosexuality is a corrupting influence on civilization as abortion. This truth has been passed down to people like us. It is our task to erase homosexuality from this world for it to be worthy of God's presence again."
 IKA_cleansing_of_atlanta: "Cleansing of Atlanta"
 IKA_cleansing_of_atlanta_desc: "Atlanta must be cleansed of it's moral decadence. The Last Days have made the heart of the South into a den of sin, almost rivaling Las Vegas, with its abortion clinics, gay bars and strip clubs, so much so that the city faced the wrath of Eric Rudolph in his bombing of the Atlanta Olympics in 1996. And much of its populace has grown accustomed to sin as a normalized fact of everyday life. As General Sherman had done before during the First American Civil War, we will cleanse the Big Peach in fire."
 IKA_ban_prenatal_infanticide: "Ban Prenatal Infanticide"
 IKA_ban_prenatal_infanticide_desc: "Since our organization was established, abortion has served as the greatest enemy to the Christian faith, rivaled only by sodomy. Although the enforcement of biblical law has made abortion obviously illegal in our territory, it hasn't been fully codified yet, as there are rumors of secret abortions being committed by individual doctors. This is nothing more than a crime. It's time to end this officially and totally."
 IKA_new_dawn_ministries: "New Dawn Ministries"
 IKA_new_dawn_ministries_desc: "While evangelical churches have ministries that send missionaries abroad every year, it's time to use them at home. Winning the hearts and minds of millions of Christians is essential to our long-term success. For even in the heart of American Christianity, atheists, heretics, and pagans abound. The New Dawn Ministries will serve as our solution to this dangerous and potentially fatal issue."
 IKA_the_seventh_seal: "The Seventh Seal"
 IKA_the_seventh_seal_desc: "And the angel will blow the trumpet to break the seventh seal. The forces of God and Jesus Christ stand triumphant. Satan and the Antichrist are in full retreat. The Last Days are at hand and the Second Coming is imminent. Let God be praised, for His reign on Earth is coming!"

 #Bridge Focus Tree
 IKA_justice_for_the_unborn: "Justice for the Unborn"
 IKA_justice_for_the_unborn_desc: "Now that peace has finally come, it’s time to punish those who defended the vile regime. Justice will be swift and the sinners will pay. Governors, communists, Klansmen, murderers, and adulterers will now all face their God-given punishment."
 #Starting National Spirits
 IKA_shall_we_gather: "Shall We Gather at the River?"
 IKA_shall_we_gather_desc: "Thanks to our recent resurgence, we have seen a large influx of recruits drawn from true-born Christians who have come here to serve us in this holy war. These recruits have formed cliques of their own within the Army, each with differing aims for creating a godly society. Some call for the Millennial Dawn, others seek to reaffirm the principle of One Nation Under God, and still others wish to bring about the Second Coming. Even if these cliques agree with us on the same goal, they are not entirely on the same page either. Such divides must be resolved quickly to preserve our unity and not just reforge America under our vision, but to overcome the influence of Satan and the Antichrist."
 IKA_military_dynamic: "Leaderless Resistance"
 IKA_military_dynamic_desc: "Since our organization came into existence in 1982, we have fought a war from the shadows against the ungodly and satanic federal government through a series of attacks on its most cherished institutions like the baby-murdering abortion clinics, using an effective model of warfare known as “leaderless resistance” wherein affiliated cells operate under our official backing without a central structure or leader to evade the authorities' grasp and fulfill God's mission.\n\nWith the government's power structures in complete collapse, our faithful cells and holy militias have emerged to take up arms to contribute to the cause in the national struggle. However, the current model is no longer needed as this war is now being fought on the blood-stained battlefields, and we must centralize our command to meet the challenges ahead of us as Christian soldiers."
 IKA_economy_dynamic: "Backwoods Economy"
 IKA_economy_dynamic_desc: "It is no secret that the Appalachians are a region where industry has been in decline, with its coal mines and manufacturing businesses going bankrupt and closing, as well as significant levels of poverty found among the populace, exacerbated further by the shortages in food or medicine caused by the Oil Crisis and the Second American Civil War. This economic decline threatens to impede the Army of God's war effort and its ability to produce enough equipment and supplies to sustain its forces in the long run. Thus, a revitalization and expansion of local industry in America's backwoods is necessary for the AOG to wage war and defeat its rivals."
 IKA_declining_religiosity: "Declining Religiosity"
 IKA_declining_religiosity_desc: "Since America’s founding, Christianity has played a significant role in its history and culture. Many consider themselves followers of God and Jesus Christ, and this land holds the distinct honor of being home to the world's largest Christian population.\n\nBut alas, the past few decades have not been kind to Christianity, as more and more Americans have turned away from God in favor of poisonous ideologies like secularism, atheism, and liberalism, resulting in church attendance plummeting and the percentage of believers falling. The influence of these ideologies has affected our numbers as we do not enjoy the same level of support as our opponents and face other issues such as a sizable majority of Christians not fully embracing our vision or internal disputes within our ranks between recruits and veterans, all of which must quickly remedied by converting as many true-born Christians as possible and crushing the sinners through force, just as our forefathers from biblical times had done before."
 
