 #Events
 IKA.1.t: "Asheville Revival"
 IKA.1.d: "Asheville may have once been a rather liberal city that agreed to give reparations to its African-American population after the death of Quinton Evans. However, that all changed when the Army of God entered town at the beginning of the Second American Civil War. Matt Shea, the devout former Washington State House Representative, wore a military uniform as he led his regiment of soldiers into the city. As Shea led the military to guard the Cathedral of All Souls, the other members of the Army of God came forward.\n\nFirst came Donald Spitz, an ordained Pentecostal minister who served as the Army of God's spokesperson and webmaster. Behind him was the infamous Steven Anderson, founder of the Faithful Word Baptist Church, with a look that could kill. Spitz took to the pulpit set up for him and looked into the microphone. He never thought he would get to this point. But God worked in mysterious ways.\n\n“Christians of Asheville, you have been liberated!” Spitz announced as the flag of the Army of God was unfurled behind him. He slammed his Bible on the pulpit and shouted, “The Whore of Babylon has fallen! Satan's greatest asset is in retreat before our Crusade! As you can see, the homosexuals, abortionists and godless atheists are scurrying away like the vermin they are! Like Sodom and Gomorrah before, God has destroyed the wicked America for its baby-killing, sodomy and greed! The long-awaited Millennium is at hand and this is where we show our faith! We must not be like Judas, who betrayed our Lord, Jesus Christ! Any so-called 'Christian' who fights against us is not a follower of God, but rather an unbeliever and servant of Satan and the Antichrist!”"
 IKA.1.a: "The holy war has begun"
 IKA.2.t: "Guardians of the Faith"
 IKA.2.d: "It is an undeniable truth that there are traitors and would-be rebels among us. They threaten to undermine our cause from within by spreading false dogmas to the American people in the hopes of toppling us. For this reason, a permanent solution is needed to combat these problems.\n\nThe solution in question comes in the form of a specialized agency known as the Guardians of the Faith or the GOF for short. The Guardians of the Faith will not just provide security and stability, but also uphold the teachings of God and Jesus Christ, specifically the Bible and the Ten Commandments. It is what some will call a “religious police” in the vein of Islamic police agencies found in Afghanistan, Iran and, before the civil war, Saudi Arabia. Regardless of such comparisons, the Guardians are our eyes and ears into the hearts and minds of the populace.\n\nThe Guardians of the Faith will serve as an essential component of the new godly society in the fight against Satan by bringing sinners to justice and protecting true-born Christians from further harm. These sinners include abortionists, advocates of the homosexual agenda, “progressive Christians,” feminists, leftists and other radicals. And it is the duty of every true-born Christian to expose them on behalf of the Guardians.\n\nEvery town and city across America shall have a Guardian on standby, making sure that every sinner will be punished and met with the full fury of God."
 IKA.2.a: "For the Lord is our judge, the Lord is our lawgiver and the Lord is our King!"
 IKA.3.t: "The Conversion Camps"
 IKA.3.d: "Conversion therapy. Conversion therapy is a medical practice that seeks to change the sexual orientation or gender of an individual to be more in line with their true identity created in God's image through various methods. Historically speaking, conversion therapy has been used by Christians and even some non-Christians to root out the poisonous diseases of homosexuality and gender ideology. It was considered by many to be a legitimate practice in the world of medicine.\n\nUnfortunately, so-called “LGBT rights” organizations and liberals would be responsible for stamping out conversion therapy by demonizing it and eventually criminalizing it. Up until the start of the civil war, it was banned in entire states and the District of Columbia.\n\nBut with the fall of Babylon, we now have the opportunity to reintroduce this divine theory to the masses. Hence, we have established conversion camps to punish or re-educate sinners to embrace Christ and reject false creeds such as homosexuality, gender ideology, paganism, and blasphemy. These camps are staffed by enthusiastic volunteers and have our full support. The conversion camps will serve as an instrument of change in bringing God and Jesus Christ back to the American people and to eliminate sin, even if we have to use harsh punishment to achieve results."
 IKA.3.a: "The wicked shall be punished for their transgressions"
 IKA.4.t: "Abortionists Under Attack"
 IKA.4.d: "“On the orders of God and Jesus Christ, you are hereby under arrest for committing prenatal infanticide,” declared an officer from the Guardians of the Faith.\n\n“What? How is that infanticide? We're only providing abortions to women who are under stress or in danger,” said the executive director of an abortion clinic.\n\nThe executive director and staff of an abortion clinic in a small Southern town were left speechless as they knew what this sentence would mean for them: hard labor and forced conversion into the radical ideology of the Army of God. Like so many others, the executive director and her staff could do nothing but watch as the Guardians of the Faith ransacked the now-shuttered place, searching for any materials worth bringing to their superiors for documentation on pro-abortion activities if they weren't going to burn them anyway. A few tried to interfere in the operation but were quickly incapacitated. The director and the staff of the abortion clinic would be arrested and sent to the conversion camps alongside other abortionists. The clinic would be just one of many abortion facilities shut down by the Guardians of the Faith.\n\nFor the officer and his comrades, they were simply doing the Lord's work by saving the lives of millions of children from being slaughtered in the womb. It was one of many steps in fulfilling the dream of a holy society. The shutdown and eventual destruction of the abortion clinic and the subsequent arrest of its employees were one of the happiest days in their lives, with the providers now sent off to the camps to repent or die.\n\nIn Army-controlled areas, the organization made no secret of its desire to “protect the unborn,” with abortion considered to be a particularly depraved crime alongside homosexuality and blasphemy. And as the organization itself was established for the purpose of stopping abortion, it was no surprise that such a law would be enforced. The head officer and other Guardians like him made it clear to any abortionists hiding amongst the public that if they were to continue carrying out such practices, severe consequences would soon follow. Within the Bible Belt, the ideological center of the Army of God, some welcomed such news with sympathy for their cause, while others felt fear and worried about what would come next."
 IKA.4.a: "Abortion is murder. Protect life"
 IKA.5.t: "Sanctification of Atlanta"
 IKA.5.d: "The city of Atlanta is ours! The last remnants of the Reds have finally surrendered and have been sent to conversion camps or eliminated. Atlanta is secure, and the process of sanctification is continuing at a steady pace, so to speak, with all centers of sin destroyed, be they sodomite bars, abortion clinics, and strip clubs, including all traces of the infamous Planned Parenthood and Magic City. In their place are holy establishments and churches to serve our cause.\n\nWith Atlanta in our hands, we can now disseminate our vision to its predominantly Baptist population as a source of recruits and use its well-established media infrastructure to spread the Word of God to the rest of the country. It will not just serve as our base of operations for the holy war but it will be rebuilt into a Christian metropolis led by the faithful, as will other American cities. The fight against Satan is a difficult struggle, but one that will be filled with triumph as we march forward to our divine future."
 IKA.5.a: "A big step towards the return of God to this forsaken land"
 IKA.6.t: "The Second Burning of Atlanta"
 IKA.6.d: "Day 5\n\nWe finally got to the city of Atlanta. The federal remnants and satanic Socialists of Redneck Revolt obviously didn't give it up easily, but 50 dead later, we have it now. The rest of the city has already fallen and is in various states of damage from the fighting.\n\nI saw a couple of Redneck Revolt members trying to flee from a hideout earlier after making a “brave last stand.” While my company wasn't the one who dealt with them, I saw the fat one's body strung up on a building on my way back to base. Good riddance. He was one of the social media managers, from what I heard, so knowing that his satanic soul is finally banished from brainwashing American youth is satisfying if nothing else. I haven't been a youth in a long time, but I do what I can.\n\nMy company was one of the only ones still purging the remnants of the enemy forces. The rest of the army has been diverted towards cleansing the city of satanic influence. They're usually tasked with either capturing and executing the worst of humanity (Planned Parenthood employees, sex workers, pro-Federal Democrats and Republicans and the like), converting buildings (like schools and offices) into institutions that serve Christ, or demolishing all reminders of the satanic government or Redneck Revolt.\n\nThe first opinion seems to be the most fun, from what I've heard from some of my friends in other companies, at least for me. I can see their work on the streets from time to time between building-sweeping missions against Satan's collaborators, and it's both great and terrifying. Many of the fat, colored-haired liberal and socialist women were hanged or crucified and left to die in the sweltering sun. The more healthy liberals and socialists were just shot when they tried to flee the wrath of God. From what I heard, homosexuals, female priests, liberal or socialist-leaning pastors, and other false Christians were the most hated targets of the soldiers, and I see why. Atlanta, for all intents and purposes, has undergone a biblical cleansing from us, the faithful believers.\n\nI don't even want to say what happens to them, but it's well deserved. Seeing a Planned Parenthood worker divided into quarters was not something I was expecting to see every day. I remember when my son was in school before the war. He was learning about the Burning of Atlanta during the First American Civil War and how Sherman destroyed Confederate morale for good. I have no particular love for either the Yankees or the empire of slavery, but I can still see that he made the best choice for shattering morale. Many liberals and socialists on social media and elsewhere have compared the actions of my friends to that of a “fascist Sherman,” and even if I'm not a direct part of the cleansing, I still feel great about everything our Army has done.\n\nI'll probably be assigned to cleanse another city after clearing out Atlanta. I should probably be grateful that I even have a working body that can serve Christ, but I still have dreams. God knows what's best for me in the end after all, and I trust Him."
 IKA.6.a: "Amen"
 IKA.7.t: "The Righteous Victorious"
 IKA.7.d: "By the grace of God, our efforts finally bore fruit. After a series of successful offensives, the Southeast is now under the banner of the Lord and Christ. The demonic forces of sin were vanquished, and we have complete authority over these lands. Soon, the rest of America will be reclaimed.\n\nSince our inception, the Army of God's holy mission has always been about avenging the millions of unborn children murdered through state-mandated abortion in order to root out Satan's influence. We are growing stronger day by day, with more faithful churches joining us and every demonic center destroyed. But most importantly, we can finally organize a new godly society built upon the principles of Christianity and further consolidate our forces against our adversaries elsewhere. There is more to come in the following months as the foundations for the godly society are established."
 IKA.7.a: "Let us usher in the moral and spiritual rebirth of America!"
 IKA.8.t: "Trial of the Godless Communists"
 IKA.8.d: "The Fulton County Courthouse in Atlanta was packed with multiple attendees and video cameras to hear the verdict delivered by the holy judges on the leaders of the now-defunct socialist group Redneck Revol: Greg Pason, Omali Yeshitela, Rakem Balogun, and Joerg Rieger. One was a socialist, one was a black nationalist, one was a Black Panther, and one was a communist wannabe preacher. These men already knew the verdict and simply chose to accept what was coming. The Army of God, after all, were religious zealots devoted to their cause and would not spare mercy upon their enemies. They wisened up as the judge delivered the official verdict after banging his gavel.\n\n“The holy court finds the godless communists of the Redneck Revolt to be guilty on all charges of blasphemy and treason and are thus sentenced to death,” the judge declared.\n\nThe four men had no words. The verdict was all they needed to hear as they were about to be taken outside the courthouse to be executed with the crowd cheering in rapturous applause. There was nothing else they could do now that the revolution had failed. The guards appeared to take the four into a black van for their execution."
 IKA.8.a: "The red specter has been exorcised in God's country"
 IKA.9.t: "Trial of the Servants of Babylon"
 IKA.9.d: "In the city of Wilmington, the local courthouse was abuzz with activity and interest as the Army of God's holy judges would deliver the final verdict on the defendants, who were all pre-war governors and servants of pre-war America, most notably Roy Cooper of North Carolina, Brian Kemp of Georgia and Henry McMaster of South Carolina. In the aftermath of the Army's victory in the Southeast, the collaborators of the Biden government in Washington would be put on trial.\n\nWith regards to the defendants, both the jury and the attendees saw them as nothing less than servants of Babylon, sinful individuals ultimately responsible for crimes against Christians for decades, from spreading sodomy to killing millions of unborn children and letting criminals loose on the streets. The jury read out their crimes to expose their true nature but nonetheless allowed the defendants to represent themselves by hiring the appropriate attorneys to argue against any possible offenses by bringing up their history of supporting conservative and Christian-related causes, such as opposing abortion. The federal conservatives were desperate to provide their credentials to avoid execution and did their best. For several hours, the jury listened to arguments for and against the sentence they would impose.\n\nEventually, the court found the likes of Cooper, Kemp, McMaster and others guilty on all charges and sentenced them to death. The trial would be their very last appearances for these men on God's green planet. The Southeast would no longer be under the reign of corrupt governors and bureaucrats.\n\nNow that the most significant obstacle to God's mission has been overcome, the Army looks forward to a bright future."
 IKA.9.a: "Good riddance to the servants of Babylon"
 IKA.10.t: "The Fiery Cross Extinguished"
 IKA.10.d: "The Ku Klux Klan was a name infamous to the people of the Bible Belt and American Christian communities since its inception from the early days of Reconstruction. It was a racist organization built on spreading terror and a false interpretation of Christianity, which claimed that Jesus and the Israelites were white Europeans and that Christians of other races were not created in God's image. Before and after the civil war, Klansmen across the South would be responsible for a number of lynchings and other hate crimes against our black brothers and sisters. One such branch, the Loyal White Knights of the Ku Klux Klan, would participate in such atrocities. With the Army of God now in control of the Southeast, it was time for the Klan to receive a well-deserved comeuppance.\n\nGrand Wizard Chris Barker, his wife and his band of Klansmen would be tried in court for crimes against fellow Christians, particularly Army of God soldiers. The jury was predominantly comprised of whites and blacks who believed in the Army's mission and resented the Klan for the irreparable harm committed against them. Barker and his wife became increasingly agitated during the trial to the point of shouting racial slurs at the jury, much to their discontent. It got to the point where a judge banged his gavel to order them to stop shouting such vile words; the Barkers reluctantly complied and chose to respond with less disgraceful language.\n\nEventually, the judges reached a verdict: The leadership of the Loyal White Knights of the Ku Klux Klan, including the Barkers, was found guilty and would be executed for their crimes. Barker and his wife could do nothing but simply scream and shout insults at the court. Thankfully, they were taken out of the courtroom to be punished for their crimes so that no one can hear their hateful rhetoric ever again."
 IKA.10.a: "The Klan is no more"
 IKA.11.t: "The Holy Council Convenes"
 IKA.11.d: "The bells in the shattered steeples sound a dull knell over the valley and plains, their peals lost in the smoke of cookfires and old ruin. At the newly rebuilt Georgia World Congress Center in Atlanta, pastors, laymen, and militiamen gathered for a very special occasion, their faith a shield against a sinful world. The Holy Council of America is convened to draft the laws of this nascent government, modeled on the Christian councils of antiquity. Yet before the last hymn has faded on the air, a schism opens, raw and profound: who among the clamorous faithful shall be granted a seat at the table of the Lord?"
 IKA.11.a: "“Let only the righteous lead: the mainline and the true.”"
 IKA.11.b: "“All who proclaim Christ's name, regardless of form, shall have a voice.”"
 IKA.11.c: "“One Kingdom, One People, One Faith. There will be no false pulpits in Zion.”"
 IKA.12.t: "A Godly Society"
 IKA.12.d: "The Council has raised its scaffolds of power from the bones of the Old World, yet a deeper question remains: How will this godly society be when the last hammer falls and the dust of assembly settles?\n\nSome envision a realm ruled by the High Reverend, the scripture as an unassailable statute and every faithful soul a citizen of Heaven's stern embassy on a profane Earth. Others, chastened by American history, demand a charter of checks and counsels, a Republic of Believers led by a devout President who can bridge the gap between the judgment of man and the eye of God. Beyond them sit the zealots who speak of a kingdom for final purification from which the Pastor would rule absolute alongside the Lord and Christ and no mortal appeal can be made."
 IKA.12.a: "“The Church shall govern as the State: His Word is our Law.”"
 IKA.12.b: "“Faith must guide the Republic, not devour it.”"
 IKA.12.c: "“No council but the pulpit, no ruler but the Lord and Jesus Christ.”"
 IKA.13.t: "Elections or Not…"
 IKA.13.d: "The delegates now approach the final and most profound matter of man s dominion over man: Whether he shall be permitted to choose his own masters. Some conjure the ghost of the Old Republic and its tattered banners, votes tallied by blind machines, its clamorous mobs and self-interested parties that styled themselves free. All of it putrefied from within, they murmur, because the fallen man placed his ultimate trust in his own corrupted reason. They instead propose that elections should be restricted to choosing only an emissary of God and his electors or even abolished outright in service of His principles.\n\nYet a counter-voice arises, warning that faith without consent is the architecture of tyranny; that God's kingdom cannot be raised upon a foundation of fear alone. Rather, the faithful should be allowed to vote in national elections to support their candidates. After all, the Old Republic, especially in its glory days, relied on the electoral participation of its faithful citizens to perform its most necessary functions in the Lord's name. The republic of believers will do very much the same."
 IKA.13.a: "“The Council shall be the sole diviner of Heaven's will; let the clergy be our electors.”"
 IKA.13.b: "“Only the faithful will make the necessary choices for the Republic.”"
 IKA.13.c: "“Elections are a vanity. The Lord and Jesus Christ alone appoint Their earthly servants.”"
 IKA.14.t: "The Law of the Lord"
 IKA.14.d: "With the council seated, all eyes turn to the matter of first judgment. The halls that once allowed usurers, thieves and other corrupters to destroy America now stand ready to weigh sin on the scales of justice. Although the Ten Commandments and other holy texts serve as our legal and moral framework against these sinners, there are disagreements about the nature of the judges who will enforce biblical law. Shall the judges, loyal they may be, speak in the dry tongue of precedent and statute, or in the raw and terrible language of scripture?"
 IKA.14.a: "“Judges shall be chosen by the Council; guardians of the Creed.”"
 IKA.14.b: "“Let local congregations elect their own judges, as the Lord sees fit.”"
 IKA.14.c: "“The sword of justice belongs to the righteous, not to the lettered.”"
 IKA.15.t: "The Final Vote"
 IKA.15.d: "The long week wanes. Smoke from tallow lamps clings to the rafters; the air hums with exhausted prayer. The delegates rise for the ultimate vote: the head of the restored nation. The clerks bring forth three names, each heavy with prophecy.\n\nThe New Apostles stand behind Spitz, the guardian of doctrine. The Pilgrims chant for Shea, the shepherd of a fractured unity. The Redeemers call for Anderson, the fanatical warrior of the faith.\n\nThe very chamber seems to shake with hymn and fury. In the end, it will come down to one name, spoken into the static of the loudspeaker, to decide the shape of God's America."
 IKA.15.a: "“And the Council votes in favor of…”"
 IKA.16.t: "Spitz Elected"
 IKA.16.d: "The Council has crowned order. Donald Spitz ascends the dais beneath the pitiless floodlights, a gaunt figure flanked by soldiers in pressed uniforms and pastors with eyes like stone. His voice carries iron in the cold air. “The age of confusion is over,” he declares. “Henceforth, from this moment, faith and law are one.”\n\nIn the weeks that follow, statues of Old Deists and Idols are toppled, replaced by plaques engraved with scripture. The ministries are renamed for saints and reformers. Bureaucracy becomes a form of liturgy, with obedience as the only surety of salvation.\n\nThe Apostles chant the new creed: Christ is reborn and the land His mortal vessel."
 IKA.16.a: "God's dominion has finally arrived"
 IKA.17.t: "Shea Elected"
 IKA.17.d: "When the final ballots fall, they spell a fragile covenant of compromise, a new chapter written in the history of the Republic, now free from its past mistakes. Matt Shea rises, his hands trembling not with fear but with a terrible gravity. He had won. He had saved America, as destined. “We are many flocks,” he tells the hushed hall, “but one shepherd watches over all.”\n\nThereafter, a wave of relieved applause breaks, and even the hardliners bow their heads as he pronounces a blessing upon them. Across the land, churches of varying rites were reopened, schools taught the scripture and patriotism, and the people dared to whisper that mercy had won the day.\n\nFor all intents and purposes, America would once more become a nation under God."
 IKA.17.a: "Indivisible with liberty and justice for the faithful"
 IKA.18.t: "Anderson Elected"
 IKA.18.d: "The hall is a crucible of light and shouting. Steven Anderson mounts the dais not as a statesman but as a fanatical warrior-prophet coming down from the mountain. “We have waited too long for a peace that does not come,” he thunders, and the crowd is a beast unleashed. “Then I saw heaven open, and behold, a white horse! The one sitting on it is called Faithful and True, and in righteousness he judges and makes war... From his mouth comes a sharp sword with which to strike down the nations, and he will rule them with a rod of iron.”\n\nBells toll a frantic rhythm as soldiers fire into the air outside. The crowd howls scripture, half prayer and half war cry. Across the heartland, structures dedicated to different creeds or religions were demolished and those who dared to resist would be executed. The night itself seems to smell of oil and incense.\n\nIn that moment, a fanatical kingdom was established, one that believed in only one creed and only one ruler."
 IKA.18.a: "The land will be purified and all sinners will perish"
 IKA.19.t: "The New Apostolic Age"
 IKA.19.d: "In the lead-up to the Second American Civil War, the United States was long under the reign of Sin possessed by the Devil, seeking to undermine this land through the vice of abortion. Roe v. Wade, Planned Parenthood v. Casey, and many other court cases after the Sexual Revolution proved this. Is a nation really worth preserving if it can't protect the most vulnerable in the unborn?\n\nThe simple answer is no and not even the words of the Constitution and Declaration of Independence can justify preserving the human-made construct that is the United States. We had long realized this fact in our decades-long militant campaign to save the unborn and to stop the spread of sodomy, leading to outright persecution by the federal government.\n\nNow, through the holy guidance of High Reverend Donald Spitz, we finally have a chance to right the wrongs of the sins of liberalism and the failures of conservatism. And that change comes through the realization that America can never be truly a nation under God, so long as its secular democratic values and institutions remain. Why? That's because the very foundations and institutions of the United States were responsible for not just the separation of church and state but also the legalization of abortion and sodomy, feminism, “religious tolerance,” and political polarization that led to the civil war. Even in 1776, it was unimaginable that a Christian nation would ever legalize so-called “same-sex marriage” or abortion. And yet, because of American liberalism and conservatism, this very thing was done over six years ago. America cannot continue to exist in this state. Thus, it must be baptized in fire and born anew just as we have done for years.\n\nAs the Apostles of the 21st century, we lead the charge against the godless oligarchs and radicals to our west. They shall fall just as the heathens of the past have. Even as the unfaithful fear for their lives, Spitz and the Army of God have no fear. For we truly know that under the light of God, there is nothing to fear."
 IKA.19.a: "Therefore, if anyone is in Christ, the new creation has come: The old has gone, the new is here!"
 IKA.20.t: "Legacy of the Pilgrims"
 IKA.20.d: "Sometimes, a nation's journey leads it back to God. And God is instrumental in the nation's very survival.\n\nWhen the Pilgrims arrived in America over 400 years ago, they came to worship and spread God's teachings by establishing Plymouth Colony and signing the Mayflower Compact. This is what America was built on. But over the centuries, especially this one, Americans seem to have collectively forgotten who we built America for: God Himself. God guided American Christians and guided our nation to victory. In this century of sin and vice, we must allow God to guide America to victory once again. Today, President Matt Shea leads our crusade to bring the United States of America back to its Christian roots.\n\nThe simple truth is that the United States is a nation founded by and for Christians from various denominations and creeds; time and time again, the signers of the Declaration of Independence and the Constitution made it clear that Christianity is the moral foundation of American identity and democracy. Christian greatness was ultimately responsible for our nation's most significant accomplishments. Sadly, there are those who are complicit in the collapse of this idea. The Democrats and Communists promote the facade that Christ is evil, while the Republicans do nothing to stop this idea from spreading. This must stop. The Army of God shall reforge the United States in the image of Christ, just as the Pilgrims and the Patriots intended. The Army of God will put Christ back into American life, just as all our ancestors intended. We will become the Republic of Believers: A true Christian democracy in a world that rejects God, and we will bring Him back into our lives.\n\nLike the Pilgrims in the Age of Discovery, the Patriots in the American Revolution, the Union soldiers in the Civil War, the American military in the World Wars, and the brave souls fighting against Communism and Islam, the Army of God will fight for America. Only this time, the fight for America is taking place inside America itself.\n\nWe are the next generation of Pilgrims and Patriots, the inheritors of a glorious legacy built upon the ideas laid forth not only by our forefathers but also by God and Jesus Christ. Just because America has forgotten God does not mean that we need to destroy it. After all, it was Christianity that truly made America great. And under President Shea's leadership, we will bring it back, no matter the cost."
 IKA.20.a: "Once more, America is One Nation Under God"
 IKA.21.t: "The Redeemer of America"
 IKA.21.d: "We arrived at our understanding, as it stands now, through observation of the natural world and prayer. It has become clear that the United States of America never lost it’s way, as our contemporaries may claim. Something cannot fall from its grace if it was malformed from the beginning; this new Babylon, founded by secular deists and pederasts, enslaves the Saxon sons of Israel and serves the goals of the New World Order. That this same nation, doomed from the beginning, would later legalize abortion, sanctify sodomy, and exalt women over men could not be a betrayal of its roots but rather its natural flowering at the expense of Christians.\n\nFor generations, Christians were taught that America could be steered back onto the right path through patience and participation. Every concession we gave has merely fed the disease. Democracy is built to protect it. Our tolerance was merely giving permission. The system, dominated by the Jews, does what it does: It elevates conscience above scripture and cannot be redeemed. It can only be endured until we ruthlessly remove the Jews and other dangerous elements forever.\n\nWe therefore reject the idea that America must be preserved. Constitutions are not covenants. Elections are not sacraments. Flags are just fabric. We recognize only one authority, and it does not flow from the people. It flows downward, from God and Jesus Christ, through Their will, and into the world, whether men and women consent or not. The task before us is thusly the removal of false religions, false morals, false freedoms. Coexistence is the paralysis of faith.\n\nOur objectives are often described as cruel because they are spoken plainly as if sin is not something to be managed indefinitely. False doctrine is not something to be debated forever. Judgement is order, not hatred. Only God can judge. Pastor Steven Anderson leads us not as a mere statesman but as the Redeemer of America. Scripture provides law. The pulpit provides command. Like our forefathers who established the Early Christian Church in the 1st Century AD Levant, we wish to establish a pure, godly kingdom in modern America. We do not expect understanding from the world besides our existing overseas network of churches. We do not seek legitimacy from those who still kneel before idols of nationhood and history. We exist to prepare the ground for a pure, godly society. What replaces America is not our concern. That it is stripped bare enough for God and Jesus Christ to rule again is."
 IKA.21.a: "For they being ignorant of God's righteousness, and going about to establish their own righteousness, have not submitted themselves unto the righteousness of God"
 IKA.22.t: "Reformation of the Apostles"
 IKA.22.d: "High Reverend Donald Spitz stood before the map of the fractured United States and had a plan to return it to God and His son, Christ, but it did not involve 'America.' Columbia, with her constitution and her courts, was a carcass to be picked clean, a testament to man's eventual failure to rule himself without the rod of iron. In her place, Spitz and the gathered Council of Apostles would not restore a republic, but erect a theocracy of such absolute divine authority that it would echo the regimens of the ancient prophets, modeled in spirit upon the holy revolutions of the past.\n\nThis was the New Apostolic Reformation hardened into statecraft from its rhetorical form. It was predicated on the belief that the secular age had ended and that the Kingdom of God must be established physically, immediately, and violently. The framework for this new order was not the Bill of Rights, but the Seven Mountain Mandate. There would be no separation of the spiritual and the civic; the church was the state, and the state was the church. The foundation of this holy work was laid not by the sword alone, but by the prophetic vision of the late C. Peter Wagner. He was the seer who looked upon the chaos of the modern American church and beheld the structure of the coming dominion. While the world slumbered in its secular apathy, Wagner drafted the map of the Seven Mountains, revealing to the faithful that their place was not in the shadows, but upon the thrones of the earth. He is the patriarch of our reformation, the first to articulate that Christ’s rule requires not just faith, but the total seizure of culture and state. Though he has passed into glory, his words remain the scaffolding of our theocracy, the divine blueprint that Spitz and the Apostles have now raised into a fortress of iron and spirit.\n\nThe hierarchy of this new dominion was rigid and biblical. At the summit sat the High Reverend and the Council of Apostles, men who claimed direct revelation from the Almighty and held the ultimate veto over all earthly affairs. Beneath them, the government of the saints: the Prophets to declare the direction of the nation, the Evangelists to spread the doctrine, the Pastors to tend the flock, and the Teachers to indoctrinate the youth. This dominion is not a lawless despotism, as the High Reverend and his Apostolic Council are chosen by the solemn rite of the Conclave, where the sanctified elders lock themselves in prayer to discern the will of the Spirit, much as the cardinals of Rome choose their Pope. Even in the lowly parishes, the faithful are granted a voice to raise up their own deacons and judges from among their number, though they may choose only from the anointed. Thus is the bitter poison of the old era purged: the endless, godless bickering of the ancient political factions that tore the nation asunder is cast into the fire, leaving only the singular, iron unity of the Cross.\n\nThe laws of this new society were etched in the granite of absolutism. The Seven Mountains: Family, Religion, Education, Media, Arts, Government, and Business. These were to be seized and purified. The family unit would be placed under the church's protection, abortion and homosexuality would be outlawed, and patriarchal headship would be enforced. The education system would be a single, streamlined engine of catechism, expunging the heresies of evolution and secular history. The media would be cleansed of all "satanic messaging," becoming a trumpet for the glory of the regime.\n\nIn this Christian Dominion, the streets would be patrolled by the moral police of the Army of God, ensuring that not a skirt was too short nor a thought too liberal. The courts would mete out biblical justice, swift and merciless, to those who dared to stand against the tide. The document Spitz signed is no longer a declaration of independence but a declaration of total war against the antichrist of modernity. America was dead; the Holy Dominion was born."
 IKA.22.a: "A Nation Under Divine Law"
 IKA.23.t: "The Apostolic Law"
 IKA.23.d: "Spitz and his fellow Apostles gathered around the table, ready to burn the America of old and bring about the America of new, one subservient to the Lord and Jesus Christ.\n\nA new code of governance, known as the Apostolic Law, would then be implemented. The Apostolic Law was no ordinary constitution. Instead, it would be the spiritual and moral framework outlining the God-given instructions of the new government involving the creation of a strong American church composed of the wisest and most benevolent ministers from the top Protestant denominations of the land: Baptists, Pentecostals, Lutherans, Methodists and Episcopalians. The structure of the church authority and government would be clearly defined with the Apostles at the top, preceded by Prophets, Evangelists, Pastors and Teachers. Moreover, the law would enshrine apostolic governance in the day-to-day affairs of God’s dominion with the High Reverend and Council of Apostles working towards His vision. The Apostolic Law  would be a mix of clerical teachings and the Holy Bible as the governing instrument of God’s Dominion.\n\nThe Apostolic Law for the Army of God would already be mostly complete; it just needed a few minor tweaks and the signatures of Spitz and his most trusted reverends. Within the Law itself, it was made very clear that only Christians would dominate all aspects of society as outlined in the Army’s original principles and the Seventh Mountain Mandate. The family unit, a Christian education system, Christian media, and the merger of church and state were the most important elements of this law, which outlined the future of the new America. The document also highlights how we will continue to wage holy war against the Satanic elements of the pre-war era. There would be no part of the government outside of Christian influence, as it was proven how bad things would be under a secular, godless government.\n\nAs the government rallies around true Christianity, the forces of Satan and his minions, along with every single enemy of God, were no longer safe under the Apostolic Law. No heretical or satanic messaging would be allowed to exist in the media, news, or education. Never again. Finally, the Apostolic Law would conclude with a declaration of loyalty to Christ, and a message calling for the death of all who stand in the way of Christ’s influence.\n\nThe New Apostolic Law would not simply serve as a mere document, but rather the final signal of resistance against Satan and the Antichrist. A final message that the influence of God has returned, and that it can’t be stopped, no matter what."
 IKA.23.a: "At last, God has finally returned to this forsaken land."
 IKA.24.t: "The Lone Preacher Falls"
 IKA.24.d: "It was the start of a day, just like any other for the head of the rapidly growing New IFB movement himself, Steven Anderson. And later on, he started recording his sermon for the day: about a victory the Army of God had recently achieved out west. After that, he planned to promote the New IFB and it’s deals within the Army at a small gathering outside his church.\n\nHowever, as he was discussing how God empowered him to lead the Army to greatness, people dressed in ANTIFA gear started throwing Molotov cocktails, bricks, and other improvised weaponry through his house. While he could use his custom-made shotgun to defend himself in his room, Anderson knew he was unprepared to fight the large number of sodomites head-on, so he looked for a way out of his house. However, these ANTIFA rioters shouting “Death to Christianity! Death to Anderson!” surrounded his entire home.\n\nUsing his last resort, he called the morality police to save him from these godless devil worshippers who somehow escaped their fate earlier. Reaching for his phone across the desk and retreating to a barricaded closet, he quickly dialed the police and asked for help.\n\n“Police! Anderson here! A large number of ANTIFAs are besieging my house, and I think a few are in my house already! You need to come quick and kill these Satanists before they kill me!”\n\nThe person on the other side replied, “That seems like a tough situation. Unfortunately, traitors and false prophets are not under the protection of the police anymore. May God have king judgement on your soul Anderson,” then immediately hung up the phone.\n\nAnderson was in major disbelief. His own Army had abandoned him…and for what? Spreading the faith? What was wrong with Spitz and his count of gullible sycophants? No, this had to be some sort of mistake. Anderson called the Guardians, other New IFB preachers, even Spitz himself - no one answered. And as the ANTIFAs made their way into his room, just outside of his closet, Anderson had one final realization: how did these ANTIFAs even make it here in such large numbers without being immediately exterminated by the Army? Wait…are these “protestors”…part of the Army?\n\nJust as Anderson realized this, the “ANTIFAs” broke down his closet and immediately put a few bullets in his head before he even had the chance to speak his final words. The protestors then quietly left Anderson’s house, back into a series of black vans, and left the scene.\n\nWhen Anderson was eventually found dead by some of his New IFB colleagues, the Army was in shock, except for a relatively calm Donald Spitz. Many were calling for another purge of sodomites and Satanists within the land, while others were questioning how the Guardians of the Faith and local police would allow such a group to assassinate a top figure in the American Christian community.\n\nThe day after, Spitz prayed for Anderson in his family and called the ANTIFAs “a disgusting scrounge of Satan.” Spitz then declared that, with the fall of the leader of the New Independent Fundamental Baptist movement, he hopes for all members of the New IFB to “find salvation” in a different church. And without Anderson’s charismatic performance to stop them, many of those forced into the New IFB by the Army under Anderson left the faith, and within the month, the movement would be rendered irrelevant after a series of conversions and an expose of their practices was released by Army officials."
 IKA.24.a: "One rebellious preacher falls"
