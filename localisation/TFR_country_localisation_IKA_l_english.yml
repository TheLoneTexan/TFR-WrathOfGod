l_english:
 #Initial Focus Tree
 IKA_babylon_has_fallen: "Babylon Has Fallen"
 IKA_babylon_has_fallen_desc: "America, the new Babylon, has finally fallen. As the country is engulfed by it's second civil war, a golden opportunity has arisen for us to truly bring about the return of God and Jesus Christ to this forsaken land. For decades, true-born Christians have been oppressed by the tyrannical government in Washington, without genuine representation and betrayed by corrupt bureaucrats on both sides. Only the Army of God saw through this facade and served as the protectors of both Christians and the unborn. With the tyrannical government in complete collapse, now is the time to create a truly holy society from the ruins of the old."
 IKA_the_red_devil: "The Red Devil"
 IKA_the_red_devil_desc: "Communism. From its inception, Communism is a godless, atheistic ideology responsible for countless crimes against Christians in the USSR, China and other such places. Most disturbing of all, there are some Americans who seek to reintroduce this ideology, even going as far as to pervert the ideals of the Lord and Christ to justify their goals. These Americans include members of Redneck Revolt, a recently re-established Marxist gun club using the guise of “anti-racism” and “anti-fascism” to spread Communism. Thus, we must destroy them before they can bring about the Red Terror."
 IKA_the_servants_of_babylon: "The Servants of Babylon"
 IKA_the_servants_of_babylon_desc: "Long ago, the United States of America was a nation with true-born believers who contributed to its very foundations and spread the word of God to millions. Sadly, these foundations are gone as the nation now murders unborn children and preaches sodomy and feminism. Anyone helping the satanic Biden administration is just as complicit in the moral and spiritual decay of America as the communists. This includes not only Roy Cooper's Southern Federal Command but also Governors Brian Kemp and Henry McMaster. These men and women are the harbingers of misfortune and sin. Thus, it is absolutely necessary to rid America of these servants of Babylon."
 IKA_finding_the_faithful: "Finding the Faithful"
 IKA_finding_the_faithful_desc: "It is no secret that America is the bastion of Christianity, with the largest population of Christians worldwide. Naturally, this includes sympathizers and supporters from various Christian churches and communities, especially those found in the Bible Belt. They come to our cause in droves. Like how God searched for righteous people in Sodom and Gomorrah, we'll look for them in Atlanta and Charleston."
 IKA_walls_of_jericho: "Walls of Jericho"
 IKA_walls_of_jericho_desc: "In biblical times, the Walls of Jericho fell when the Israelites marched around the walls seven times and shouted. The civilization of Canaan and its King were met with God's righteous fury. As the modern-day successors to the Israelites, the same shall happen here. Atlanta will fall while we sing hymns to God and Jesus Christ."
 IKA_guardians_of_the_faith: "The Guardians of the Faith"
 IKA_guardians_of_the_faith_desc: "Satan's forces have historically targeted Christian communities and have infiltrated them with decadent, liberal ideas such as the acceptance of homosexuality, female pastors and race hustling. It's no surprise that American Christianity has been on the decline as more and more Christians are accepting liberal ideas or turning away from the church. To say nothing of the many sinners and pagans that exist. We cannot continue to tolerate this kind of behavior and a course correction is needed to rectify these troubles. Henceforth, we shall establish a new kind of security agency in America known simply as the Guardians of the Faith, which will bring these fake Christians and sinners to judgment."
 IKA_open_the_conversion_camps: "Open the Conversion Camps"
 IKA_open_the_conversion_camps_desc: "Conversion therapy is a medical doctrine historically used to overcome the sin of homosexuality through every possible means necessary. Christian organizations and the like have used it to cure people of the homosexual disease, only for the Washington government and others to clamp down on this legitimate practice, even as Christians continue it in secret. The unfortunate consequences of such bans include the acceptance and promotion of sodomy to the public. Thankfully, conversion therapy shall be reintroduced through our newly-created conversion camps to serve as a field mission and a place of penance for the sinful."
 IKA_valley_of_death: "Through the Valley of Death"
 IKA_valley_of_death_desc: "We are pinned in the mountains, surrounded by enemies on all sides. It is a holy struggle against Babylon's servants that began in the Southern Appalachians. As soldiers of Christ, we are training our recruits and veterans to properly engage the Federal forces in battle. This experience and discipline will give our soldiers the necessary tools and methods to vanquish this satanic threat."
 IKA_we_shall_not_fear: "We Shall Not Fear"
 IKA_we_shall_not_fear_desc: "God is our refuge and strength. Jesus is our Savior. We shall overcome. Those who die for His cause are assured a place in Heaven."
 IKA_chariots_of_iron: "Chariots of Iron"
 IKA_chariots_of_iron_desc: "Much like the iron chariots used in the past, the tanks of today are the armored guards of the world's top fighting forces and the Army of God is no exception. They are mighty machines of war that bring destruction in their wake and dominate modern battlefields alongside the jets. Every other faction in the Second American Civil War uses them. Thanks to our connections within the military, we will acquire some tanks from a nearby army base for our use."
 IKA_show_them_his_truth: "Show Them His Truth"
 IKA_show_them_his_truth_desc: "We must show our skeptics the truth of Jesus's divinity and his sacrifice for their sins. Too many Americans are being led astray by false prophets and propagandists who spread a distorted view of the situation. However, we can show them the light through the word of God. Service in the Army is the first step. Thus, they must be encouraged to join our cause for forgiveness."
 IKA_servants_of_molech: "Cast Out the Servants of Molech"
 IKA_servants_of_molech_desc: "Abortion, homosexuality, transgenderism and liberalism are all disgusting sins in the modern world and little more than annual rituals for the satanic government, much like how Moloch was the pagan god the Kingdom of Israel sacrificed babies to. It is shameful to see these practices become so commonplace in America. And our enemies have the backing of the satanic government and its collaborators. As such, all who participate in the rituals themselves deserve the same punishment that they would get for murdering and brainwashing our children."
 IKA_the_greater_evil: "The Greater Evil"
 IKA_the_greater_evil_desc: "The United States of America is unique in that it was a nation founded by and for Christians who believed that biblical values were the key to civic participation, and later served as a bulwark against Communism during the Cold War. While the current government is undoubtedly evil, the communists support all the sins of theirs and are substantially worse as they wish to replace God with Karl Marx and Christianity with their twisted atheist belief system in an effort to destroy our country. More importantly, many American Christians see the United States itself as God's nation and choose to fight for their Creator under its banner. With the U.S.'s fate at stake, it would be wise of us to take up the mantle of the protectors of the American Dream to liberate it from sin."
 IKA_rejecting_satan: "Rejecting Satan"
 IKA_rejecting_satan_desc: "The United States may be nostalgic and beloved, but it was never truly Christian. It was, after all, the same nation that took the church away from the state and was created by heretical Freemasons to subvert God's will through secularism. Centuries later, this same nation has overseen the rise of sodomy, abortion, feminism and other earthly sins, clearly the result of the secular system established by these Freemasons. Recently, a growing number of Christians have come to the conclusion that the U.S. is beyond saving and should be torn down entirely in favor of something new. We must destroy this mortal creation to replace it with a purer, more godly one."
 IKA_baptism_by_fire: "Baptism by Fire"
 IKA_baptism_by_fire_desc: "We are learning while we are fighting. As bullets rain over us, we grow stronger and more resilient. We are becoming unstoppable. It is, as some might say, a baptism born in the fires of war."
 IKA_equal_under_god_not_man: "Equal Under God, Not Man"
 IKA_equal_under_god_not_man_desc: "We are all created equal in the eyes of God and His law. However, this does not mean we are to be literally equal in everything. Instead, true equality comes from faith. Money is temporary, but Heaven is forever."
 IKA_holy_minutemen: "The Holy Minutemen"
 IKA_holy_minutemen_desc: "With faith in his heart and a gun in his hand, the Minuteman asks for nothing but the freedom of his soul and those of his countrymen. He is no terrorist or insurrectionist but a citizen deeply concerned for the well-being and prosperity of his people and his land. He is fighting for a nation truly blessed by God with liberty and justice for the true-born believers. Like the Patriots of old, he seeks to free them from servitude, whether to an overseas empire or Satan himself."
 IKA_servants_of_mammon: "Servants of Mammon"
 IKA_servants_of_mammon_desc: "The love of money is the root of all evil and you cannot serve God and money. The wealthy were the biggest advocates of sinful indulgence and provided substantial support for the sins of today. But now, their federally-backed networks are vulnerable to the effects of war. As punishment, they will be sent to the camps and their assets seized for Jesus."
 IKA_god_hate_gays: "God Hates Gays"
 IKA_god_hate_gays_desc: "While the Westboro Baptist Church is a strange and hermetic cult run by the Phelps family, their protests proved true that the legalization of homosexuality made America fall like Rome before it or Sodom and Gomorrah. Homosexuality is a corrupting influence on civilization as abortion. This truth has been passed down to people like us. It is our task to erase homosexuality from this world for it to be worthy of God's presence again."
 IKA_cleansing_of_atlanta: "Cleansing of Atlanta"
 IKA_cleansing_of_atlanta_desc: "Atlanta must be cleansed of it's moral decadence. The Last Days have made the heart of the South into a den of sin, almost rivaling Las Vegas, with its abortion clinics, gay bars and strip clubs, so much so that the city faced the wrath of Eric Rudolph in his bombing of the Atlanta Olympics in 1996. And much of its populace has grown accustomed to sin as a normalized fact of everyday life. As General Sherman had done before during the First American Civil War, we will cleanse the Big Peach in fire."
 IKA_ban_prenatal_infanticide: "Ban Prenatal Infanticide"
 IKA_ban_prenatal_infanticide_desc: "Since our organization was established, abortion has served as the greatest enemy to the Christian faith, rivaled only by sodomy. Although the enforcement of biblical law has made abortion obviously illegal in our territory, it hasn't been fully codified yet, as there are rumors of secret abortions being committed by individual doctors. This is nothing more than a crime. It's time to end this officially and totally."
 IKA_new_dawn_ministries: "New Dawn Ministries"
 IKA_new_dawn_ministries_desc: "While evangelical churches have ministries that send missionaries abroad every year, it's time to use them at home. Winning the hearts and minds of millions of Christians is essential to our long-term success. For even in the heart of American Christianity, atheists, heretics, and pagans abound. The New Dawn Ministries will serve as our solution to this dangerous and potentially fatal issue."
 IKA_the_seventh_seal: "The Seventh Seal"
 IKA_the_seventh_seal_desc: "And the angel will blow the trumpet to break the seventh seal. The forces of God and Jesus Christ stand triumphant. Satan and the Antichrist are in full retreat. The Last Days are at hand and the Second Coming is imminent. Let God be praised, for His reign on Earth is coming!"

 #Bridge Focus Tree
 IKA_justice_for_the_unborn: "Justice for the Unborn"
 IKA_justice_for_the_unborn_desc: "Now that peace has finally come, it's time to punish those who defended the vile regime. Justice will be swift and the sinners will pay. Governors, communists, Klansmen, murderers, and adulterers will now all face their God-given punishment."
 IKA_holy_council_of_america: "The Holy Council of America"
 IKA_holy_council_of_america_desc: "We shall convene the largest Christian council in history since Nicea to determine the way forward in Atlanta. From here, we will be able to determine what kind of holy society should exist. It will also serve as a showcase for what to expect from a truly Christian America to the rest of the world. Congregations across the land shall convene to craft our policies and principles."
 IKA_the_apostles: "The Apostles"
 IKA_the_apostles_desc: "The core of the organization and Donald Spitz's new allies, the New Apostolic Reformation, will lead the way forward. His leadership helped the Army of God survive even in its most dire times and become a force to be reckoned with. Without him, the Army would not have been able to evolve and adapt to the 21st century. It is the very reason why the Army of God would stay true to our leader's original vision. Though High Reverend Spitz will continue his leadership in line with the Army's original principles, his new allies have some interesting beliefs and the idea that perhaps we live in a New Apostolic Age like that of St. Peter and St. Paul."
 IKA_the_pilgrims: "The Pilgrims"
 IKA_the_pilgrims_desc: "In an unsurprising turn of events, the many volunteers who came to President Matt Shea's aid have seen the United States for what it truly is: A Christian nation founded by the Pilgrims in Plymouth and the Patriots in Philadelphia. The nation shall be placed back in the hands of American Christians just as our forefathers intended. And they will make sure it shall stay as such. No longer will this great nation be led astray by Globalist and Islamo-Marxist influence. Instead, the Shea administration will rebuild the United States in God's image once more."
 IKA_the_redeemers: "The Redeemers"
 IKA_the_redeemers_desc: "A devout candidate has secured victory with newly converted zealots and volunteers to his cause. Pastor Steven Anderson and the New Independent Fundamentalist Baptists will now have the opportunity to radically reshape America in line with their vision. A vision with significant consequences for the future. May God have mercy on the sinful!"
 
 #New Apostles Focus Tree
 IKA_expose_democracys_godless_origin: "Expose Democracy's Godless Origin"
 IKA_expose_democracys_godless_origin_desc: "The secular, man-made system of governance known as democracy was not something our ancestors in biblical times would have wanted. Rather, democracy was a pagan invention originating in Ancient Greece, later adopted by Ancient Rome and eventually reaching America. Democracy was also responsible for America's eventual descent into sin. It is thus evident that democracy, with all its godless foundations and political bickering, will have no place here and shall be replaced with a more godly system of governing our country."
 IKA_new_apostolic_reformation: "New Apostolic Reformation"
 IKA_new_apostolic_reformation_desc: "The New Apostolic Reformation is not just a theological doctrine created by the late C. Peter Wagner; rather, it was the manifestation of God's will on Earth to usher in the New Apostolic Age for all of humanity under the guidance of a trusted council of powerful Apostles. Wagner demonstrated the importance of a well-organized hierarchy of Christian clergy in establishing a holy dominion by setting forth the central precepts of the New Apostolic Reformation. Much like the Apostles of antiquity, the Apostles of the modern era shall draft essential legislation and oversee our government. The American church will be our vessel to deliver the shining light of God and Jesus Christ upon the world." 
 IKA_punishment_for_the_wicked: "Punishment for the Wicked"
 IKA_punishment_for_the_wicked_desc: "Within our realm exist sinners secretly indulging in the vices of the old liberal regime, having evaded our grasp. Despite the best efforts of the Guardians of the Faith, these sinners go unpunished. To rectify this problem, we will expand Guardian operations to more vigorously prosecute the servants of Satan and the Antichrist." 
 IKA_place_of_women_and_non_believers: "Place of Women and Non-Believers"
 IKA_place_of_women_and_non_believers_desc: "God's Dominion is filled with people who do not conform to Christian values and go against their God-given roles or follow different creeds from ours. These people include women who refuse to be responsible mothers and those not of the Covenant, most notably Muslims. We cannot simply ignore this issue any longer. As such, we will reorganize the American woman's space and enforce the “Unbeliever Tax” for those who are neither Christian nor Jewish." 
 IKA_ban_secular_education: "Ban Secular Education"
 IKA_ban_secular_education_desc: "The introduction of secular education was one of many sins prevalent within America in the lead-up to the civil war. Here, Christian students were taught to believe in so-called “Objectivity,” Big Science, Critical Theory and other falsehoods. In addition, the secular system removed school prayer and lectures on Christian theology under the pretense of “freedom of religion.”  Under our school system, secular education will be banned and relegated to a thing of the past." 
 IKA_removing_satans_lies: "Removing Satan's Lies"
 IKA_removing_satans_lies_desc: "The Satanic education system taught Christians in America to believe that the existence of God was uncertain, that evolution was an empirical fact in the creation of life and that gender was not binary. This nonsense was only made prevalent thanks to the liberal academia. Such lies shall be expelled from the classrooms and replaced with holy truths." 
 IKA_bible_study_classes: "Bible Study Classes"
 IKA_bible_study_classes_desc: "The Bible is the most sacred text in all of Christendom, read and studied by believers in numerous languages. Christian schools are no exception to this, as the youth enroll in Bible study classes to learn about the importance of following God's commandments and the sacrifice and resurrection of Jesus Christ for all of humanity. It is also one of the governing instruments for God's Dominion alongside the Holy Bible. With more teachers willing to teach Christian values, we will establish more Bible study classes in new or recently converted educational facilities." 
 IKA_teach_the_rapture: "Teach the Rapture"
 IKA_teach_the_rapture_desc: "The Rapture is the end-times apocalypse prophesied in 1 Thessalonians 4 and 1 Corinthians 15, where God will bring together living and dead Christian believers to meet with their Creator in Heaven. It is one of the most biblically significant events in the future. As we lay the foundations for Jesus' 1,000-year reign on Earth, we must remind our believers what the Rapture is and what to expect." 
 IKA_integration_of_church_and_state: "Integration of Church and State"
 IKA_integration_of_church_and_state_desc: "As the old saying goes, America was founded on the separation of church and state, with the church itself barred from playing any meaningful role in shaping public policy, in contrast to the Old World. But we are not the America of old, as this artificial separation is no more. A new age of God has arrived upon this country: Church and state will become one." 
 IKA_cross_on_government_buildings: "Cross on Government Buildings"
 IKA_cross_on_government_buildings_desc: "The Christian cross is the defining symbol of the Christian faith, recognized by billions worldwide. And as a Christian government, we will display reminders of our faith. This will let the world know that we are a truly Christian nation." 
 IKA_new_covenant_for_america: "New Covenant for America"
 IKA_new_covenant_for_america_desc: "As part of our holy reconstruction of America, we have taken the task of implementing a Christian legal code derived from biblical law. It is a covenant whose principles are inherently Christian and godly in nature. We will use this covenant as the basis for divine justice." 
 IKA_unify_the_churches: "Unify the Churches"
 IKA_unify_the_churches_desc: "There are over 219 million Americans today who identify themselves as Christians across various denominations. Protestantism is by far the largest of these Christian denominations and the main focus of our mission. Spitz, drawing upon experiences as a Pentecostal minister, seeks to unify the churches into a collective, if not a single religious authority on American Christianity. With the diverse and varied nature of Protestant churches, unity is absolutely necessary if we are to establish God's Dominion. Therefore, we shall bring the Protestant churches of America under one banner." 
 IKA_finding_the_apostles: "Finding the Apostles"
 IKA_finding_the_apostles_desc: "It isn't easy governing a nation large in size and population. The High Reverend is aware of this burden and has requested assistance from Apostles of various Christian organizations. They are ministers, experts in ancient scripture who can correctly interpret such texts and put them into practice. Like the Pope and the Cardinals of Rome, the High Reverend and the Apostles shall establish a government close to God and Jesus Christ." 
 IKA_seize_heretical_churches: "Seize Heretical Churches"
 IKA_seize_heretical_churches_desc: "In recent years, an alarming number of American churches have embraced dogmatic and ungodly causes like homosexuality, transgenderism, feminism, “interfaith dialogue,” and anti-white racism. These churches are also a refuge for so-called female and gay pastors pretending to spread the word of God by subverting its ideals. Fortunately, the Guardians of the Faith are here to enforce biblical doctrine and shut down these heretic-run churches for good." 
 IKA_appoint_holy_judges: "Appoint Holy Judges"
 IKA_appoint_holy_judges_desc: "For our holy courts, judges well-versed in biblical law are required to make important decisions on legal matters. The secular judges will be cast aside. In their place will be lawmakers truly dedicated to God." 
 IKA_launch_the_apostolic_news_network: "Launch the Apostolic News Network"
 IKA_launch_the_apostolic_news_network_desc: "To spread the word of God to the masses, we have decided to establish the Apostolic News Network (ANN) as the official broadcasting service for the Army of God. The ANN will serve not only as a source of Christian entertainment but also as an important source of information, to present an honest and truthful image of ourselves to the world. We will leverage Atlanta's extensive media infrastructure and the Internet to make our message more widely known. The ANN will be to us what the Christian Broadcasting Network is to the Robertsons." 
 IKA_christian_c_span: "Christian C-Span"
 IKA_christian_c_span_desc: "With the establishment of the Apostolic News Network, a broadcasting service for the holy government is needed. It will serve a similar purpose as C-Span, the broadcasting service of Washington. This time, however, it will be as much a gateway to God as it is to governmental matters." 
 IKA_spitzs_sunday_sermons: "Spitz's Sunday Sermons"
 IKA_spitzs_sunday_sermons_desc: "Spitz is a man of God and is willing to use any medium to spread the Gospel. Television and video-sharing websites are no exception as Spitz himself wants to make sure that every American knows his name for better or worse. With the power of television and social media, we will make sure that the High Reverend's voice is heard in millions of homes across the country." 
 IKA_ban_satanic_entertainment: "Ban Satanic Entertainment"
 IKA_ban_satanic_entertainment_desc: "The airwaves are filled to the brim with blasphemous, obscene and utterly Satanic entertainment that violates Christian norms and mocks our Creator and Savior. There are entire films, television shows, video games, songs and anime that defame and belittle our faith or introduce sinful ideas to the public. In a godly society, this filth will be stamped out entirely. From now on, there will only be biblically approved entertainment" 
 IKA_dominion_theology: "Dominion Theology"
 IKA_dominion_theology_desc: "The core of our holy message is Dominion Theology or Dominionism, the belief that Christians must dominate all aspects of modern society under a single dominion with biblical law as its legal framework for what it should be. It is the only form of holy government perfectly suited to Christian governance in the modern era. Dominionism also allows us to secure complete control over the lives of millions of Christians and to cleanse modern society of its sins. But most importantly, it brings America and the world closer to God. Under the leadership of Spitz and the Apostles, Dominion Theology will be our credo." 
 IKA_burn_demonic_books: "Burn Demonic Books"
 IKA_burn_demonic_books_desc: "The shelves of American libraries and bookstores are filled with texts that spread sinful ideas and treasonous thoughts. They are the books that claim communism is good, homosexuality is normal and God is dead. Fortunately, these books will be burned at the pit and will no longer be in the possession of any faithful Christian who might be led away from the path of righteousness." 
 IKA_burn_the_followers_of_the_crescent_moon: "Burn the Followers of the Crescent Moon"
 IKA_burn_the_followers_of_the_crescent_moon_desc: "Islam is one of Christianity's greatest enemies since the conquests of the 7th century and the Crusades. It has been responsible for the persecution of millions of Christians, terrorist attacks against us and our Jewish brethren in Israel. And the most frightening part of all this is that these incidents are a frequent occurrence in the West. But like the Crusaders of old, we will stamp out the Islamic threat within our borders." 
 IKA_execute_abortionists: "Execute Abortionists"
 IKA_execute_abortionists_desc: "The Army of God has always been defined as a Christian organization established for the purpose of stopping the baby-killing practice of abortion in America. Abortionists have always been our enemies and we have delivered God's wrath upon them for decades. This time, however, they will have no federal government to protect them. Rather, the abortionists will be given the death sentence for their crimes against the unborn." 
 IKA_cleansing_fire: "Cleansing Fire"
 IKA_cleansing_fire_desc: "God is a consuming fire, a fire that will burn away sin until there is nothing left of it. It is like the raging inferno, a force of righteous fury. These flames will rise higher as we march to victory." 
 IKA_destroy_the_gay_agenda: "Destroy the Gay Agenda"
 IKA_destroy_the_gay_agenda_desc: "In just two centuries, the gay agenda has made great strides in normalizing the perverse sin that is sodomy to millions of Americans with the full support of the federal government in Washington. Nowadays, the gay agenda has spread its poison deep into the soul of the Christian public like a venomous snake. But to us, the snake and its poison will not go unnoticed. We will eliminate the snake and remove its poison from the American essence." 
 IKA_true_womens_liberation: "True Women's Liberation"
 IKA_true_womens_liberation_desc: "For decades, American women have been sold the false lie of feminism as the path to women's liberation by leading them to abandon their husbands, embrace sexual promiscuity, abort their future children and disrespect patriarchal authority. This lie will come to an end as we will reinforce the true form of women's liberation based on the teachings of the Bible. Women will once again learn how to be good wives and mothers whilst achieving spiritual liberation from sin." 
 IKA_save_the_children: "Save the Children"
 IKA_save_the_children_desc: "Children are the most precious things in a sane society, as they are young, impressionable, and easy to instill faith within their minds from a young age. That includes shielding them from the dysphoric disease of transgenderism. We will raise our children to be the next generation of holy warriors and devout Christians." 
 IKA_respect_the_housewife: "Respect the Housewife"
 IKA_respect_the_housewife_desc: "The housewife is perhaps the most honorable profession for any responsible woman concerned with the sanctity of her household and the well-being of her family. The housewife is also closer to the household and family than her non-housewife counterparts. It is thus reasonable to promote the housewife ideal among American women through PR campaigns and other media." 
 IKA_allow_feminine_jobs: "Allow Feminine Jobs"
 IKA_allow_feminine_jobs_desc: "It is a simple reality that the modern workforce can't function without the involvement of women and men. Moreover, the absence of women in the workforce would harm our economy's productivity and efficiency. We will thus designate a list of acceptable jobs and occupations for female employment. These jobs will be feminine jobs where women are naturally predisposed to work in these sectors with blue-collar work, military service and government ministries reserved solely for men." 
 IKA_khrushchevs_scheme_foiled: "Khrushchev's Scheme Foiled"
 IKA_khrushchevs_scheme_foiled_desc: "Soviet General Secretary Nikita Khrushchev thought he could subvert the American family and the Christian faith by spreading the Sexual Revolution to make Communism look good. His scheme may have succeeded for a while but it won't for any longer. We will dismantle Khrushchev's plan and ensure that the American family and Christianity are preserved." 
 IKA_pornography_equals_death: "Pornography Equals Death"
 IKA_pornography_equals_death_desc: "Pornography is nothing more than the degradation of women and men into nothing more than sexual objects for arousal. It is the new drug, an addictive substance that rots the individual's physical and mental well-being. And like drugs, we will launch an aggressive anti-pornography campaign to contain this smut from spreading amongst the public." 
 IKA_define_sinful_behavior: "Define Sinful Behavior"
 IKA_define_sinful_behavior_desc: "What is considered sinful behavior in the eyes of many Christians? Abortion, sodomy, pornography, idolatry and swearing. These are all disgusting and abominable sins encouraged and promoted by modern secular society. And they are corrupting forces as well. It is thus necessary to understand what constitutes sinful behavior so that we can banish these troublesome elements and avoid past mistakes." 
 IKA_national_blue_law: "National Blue Law"
 IKA_national_blue_law_desc: "Since the 17th century, many places in America have enforced what are known as Blue Laws. Created by the Puritans of Massachusetts, the Blue Laws mandate a set of holy regulations for businesses on Sunday, namely restrictions on the sale of alcohol, automobiles, and nonessential goods, or a complete ban on recreational activity. They are designed to uphold Christian norms and bring the people closer to God. Thus, we will establish the National Blue Law to ensure that Christian norms are respected on the most holy of days." 
 IKA_the_spitz_code: "The Spitz Code"
 IKA_the_spitz_code_desc: "The wisdom of High Reverend Donald Spitz cannot be ignored; it must be acknowledged as holy truth from the word of God. As a minister and leader for the unborn, Spitz has laid down guidelines for the American media on what it must do and for serving as a shining example of Christian entertainment, known officially as the Spitz Code. It is a code of conduct that prohibits the promotion of sinful ideas and promotes holy virtues in the vein of the Hays Code of old. The Spitz Code will ensure that the American media will become the beacon of Christianity once more." 
 IKA_a_godly_society: "A Godly Society"
 IKA_a_godly_society_desc: "What makes a godly society? The answer to this question is that a godly society relies not just on civic participation but also on strong belief in God's will. As the secular United States is dismantled, the Holy Dominion rises in its place. Unlike the federal government of the past, there will be no abortions and no sodomy. Instead, true justice will be delivered upon the baby-killing murderers and Christian morality shall triumph. And the Holy Dominion will be here to ensure a godly society is fully realized." 
 IKA_millennial_dawn: "Millennial Dawn"
 IKA_millennial_dawn_desc: "At long last, the godly society has been fully realized and we have laid the groundwork for the eventual return of Jesus Christ to Earth. Through trial and tribulation, the forces of Satan have been vanquished and God stands triumphant. High Reverend Donald Spitz may not live to see this day but he has ensured that it will eventually come. And we look forward to this momentous occasion. In just 1,000 years, the Lord and Christ will finally establish a new, permanent era of prosperity and virtue for the world."  

 #Military Focus Tree
 IKA_assyria_at_the_gates: "Assyria at the Gates"
 IKA_assyria_at_the_gates_desc: "The ancient Mesopotamian civilization of Assyria was the greatest threat to the Kingdom of Judah in biblical times and was on the verge of wiping out Judah, until the divine wrath of God secured its victory over the Assyrian forces. Today, we are the modern Judah. And like the warriors of Judah before us, we are struggling against dangerous and powerful enemies at our doorsteps. Our forces are decentralized cells slowly slowly together to stop the evils corrupting America. Let us pray that God will lead us to victory against these evils." 
 IKA_army_of_the_faithful: "Army of the Faithful"
 IKA_army_of_the_faithful_desc: "In the fight against Satan's forces, we cannot afford to be picky with our soldiers. All who profess a belief in Jesus Christ as Savior and Redeemer are worthy of serving in our Army. Every soldier must fight for God. Those who die will be taken straight to Heaven just like all His other soldiers from history."
 IKA_army_of_the_sanctified: "Army of the Sanctified"
 IKA_army_of_the_sanctified_desc: "It is not enough to merely profess a belief in Jesus. Heretics claim to believe in Jesus all the time, but their teachings are distorted. Even those with the right belief could still lack conviction. We must keep our army at a high standard and refuse the temptation to ease recruitment. Only a soldier truly committed to God can fight with enough fervor to earn His favor."
 IKA_call_to_the_american_faithful: "Call to the American Faithful"
 IKA_call_to_the_american_faithful_desc: "Come all ye faithful to the Army of God! The Lord is looking for willing men who will fight and die for His truth! He has drawn His terrible, great sword on the sinners of America and has called for their destruction."
 IKA_reclaiming_the_bible_belt: "Reclaiming the Bible Belt"
 IKA_reclaiming_the_bible_belt_desc: "The South has been traditionally called the Bible Belt due to our high religiosity compared to the rest of America. Yet even in this supposedly faithful land, Redneck Revolt, a communist serpent of Satan, attempted to bite and envenomate America. With them gone, we must also destroy the dueling racists to our west and bring more Christians under the cross!"
 IKA_join_the_national_front: "Join the National Front"
 IKA_join_the_national_front_desc: "The Whore of Babylon surrounds us, whether in DC, Denver, or San Francisco. To the north, however, we have some hope. We are extending a request to the Patriot Front and the National Socialist Movement to join the National Front in our quest to purge America of Satanic influence. While we obviously think there are sinners within both organizations, it is preferable to have allies who share our holy convictions and common enemies, as we cannot hope to fight this war alone without significant outside support. Nevertheless, we must become the strongest faction of this alliance and then take charge before the faulty secularists attempt to assert control."
 IKA_reject_the_heretics: "Reject the Heretics"
 IKA_reject_the_heretics_desc: "Within the dark corners of the American radical right, there are fascists and literal Nazis who hate our Christian brethren of color and even denounce our faith as not being racially pure. They are the same people behind the National Front, who expect all Christians to submit to them as opposed to God and Jesus Christ. They are also the same people who shut down entire churches just for speaking for Christ and denouncing their wacky racial ideas as sin. We cannot simply side with these people and hope they will restore the Lord's rightful sovereignty over America. Instead, the National Front must be treated like a disease and eliminated for the good of the American Christian public."
 IKA_frontline_of_the_antichrist: "Frontline of the Antichrist"
 IKA_frontline_of_the_antichrist_desc: "Florida has fallen to perhaps the most vile group imaginable: The Atomwaffen Division. They are a Satanic terrorist group wearing the mask of Christianity to further the spread of Nazism. Worst of all, we have discovered Atomwaffen cells within our ranks. We shall put an end to this Satanic distortion; May God have mercy on their souls, for we have none!"
 IKA_proclaim_holy_war: "Proclaim Holy War"
 IKA_proclaim_holy_war_desc: "The Holy Bible may preach peace, but when it is Christendom itself that is threatened, then it is every Christian's duty to proclaim holy war against those who threaten all that is good in this world. God Himself has directed us thus far against overwhelming odds, but now is His true test: to destroy Satan's grasp on America and begin the process of creating His kingdom."
 IKA_slaying_the_whore_of_babylon: "Slaying the Whore of Babylon"
 IKA_slaying_the_whore_of_babylon_desc: "The Union of America and the American People's Liberation Army are the most vile beasts imaginable. The Unionists are fellow conspirators of the New World Order and the Communists are Karl Marx's Satanic horde seeking to demolish America's Christian foundations. Both are the Whore of Babylon who will be struck down in the Last Days at God's Hands."
 IKA_rejecting_the_false_messiah: "Rejecting the False Messiah"
 IKA_rejecting_the_false_messiah_desc: "The American Constitutional Government is nothing more than a personality cult for Donald Trump and his gaggle of lukewarm, insincere Christians. He took away several of America's faithful when they were needed most and he is awfully blase about the pagan Muslims and Hindus through his connections with Saudi Arabia and India. He is a Judas in our midst and must be dealt with."
 IKA_call_to_those_faithful: "Call to Those Faithful"
 IKA_call_to_those_faithful_desc: "Millions of Americans are ready to fight for God, whether it is Baptists from Texas working in oil fields, Catholic plumbers in Arizona, or Orthodox monks in New York. All faithful Christians in America shall be inspired to fight under the sign of the Cross, which Jesus died on, and rise again as He did from the grave."
 IKA_redemption_for_the_penitent: "Redemption for the Penitent"
 IKA_redemption_for_the_penitent_desc: "Many false Christians have been captured in our wars thus far, and some have confessed to their sins. Perhaps they could have their redemption by taking up arms and fighting in God's Army for two years. If they survive their service, they shall be rewarded with absolution. If they die, they are taken up to Heaven to live in God's presence forever."
 IKA_biblical_basis_for_war: "Biblical Basis for War"
 IKA_biblical_basis_for_war_desc: "Matt Shea outlined the process of fighting against the forces of Satan and the Antichrist in his personal guide titled Biblical Basis for War. He recommended the reorganization of America along theocratic lines, the creation of a unified “Holy Army” of faithful Christians and any and all men who did not yield to biblical law to be executed for their sins. Regardless of our differences, his lessons will be valuable and useful for the holy war."
 IKA_faithful_of_all_nations: "Faithful of All Nations"
 IKA_faithful_of_all_nations_desc: "The Army of God is not merely an American institution, but a global one. Christians who are oppressed by secular governments in Europe and by Muslims in the Middle East shall join our army, along with the faithful in Africa, the Asia-Pacific and Latin America, seeking to bring Christianity back to one of its most historic strongholds."
 IKA_the_fortress_of_god_and_jesus_christ: "The Fortress of God and Jesus Christ"
 IKA_the_fortress_of_god_and_jesus_christ_desc: "A Mighty Fortress is our God. Such were the words of German religious leader Martin Luther in his writings, as he stood against the Catholic Church when it was corrupted by indulgences. The Army of God shall resemble the fortress of God. We shall fight with tenacity and remember that the price of failure is Satan claiming more souls before Jesus returns."
 IKA_remember_waco: "Remember Waco"
 IKA_remember_waco_desc: "The current American government hates Christians. After shooting an innocent man's wife and dog dead in Idaho, they went to Waco to siege a group of Seventh Day Adventists who dared to practice their Second Amendment rights. They slandered David Koresh as a cult leader and used it as an excuse to gas children and burn them alive, all for refusing to bow to the Beast. We must remember that and fight to avenge the Christian children who died that dreadful day."
 IKA_establish_the_chaplain_corps: "Establish the Chaplain Corps"
 IKA_establish_the_chaplain_corps_desc: "While chaplains have always been a part of the military, many times there are non-denominational soldiers who have no clergy to call on to minister to them, or even chaplains who preach Jesus was a prophet instead of God Himself. We will establish the Chaplain Corps as a core part of our military, ensuring that all soldiers participate in True Christian services without heretical corruption."
 IKA_lessons_from_the_reds: "Lessons from the Reds"
 IKA_lessons_from_the_reds_desc: "Redneck Revolt was a disgusting group whose so-called “Christians” thought Jesus's denunciations of the rich meant the poor were free to indulge in the most vile sins and who taught envy was a virtue instead of a sin. However, they showed how to spread their message to the masses and convince many of a strange ideology that only academics believe in. More importantly, Redneck Revolt employed innovative guerrilla tactics and well-organized militias that proved to be formidable fighters on the battlefield. Because of this, we will adopt our enemies' effective militia model in an age of asymmetric warfare, under a centralized command structure designed to leverage our advantages."
 IKA_recruit_from_the_downtrodden: "Recruit from the Downtrodden"
 IKA_recruit_from_the_downtrodden_desc: "The meek shall inherit the Earth. The poor have typically turned to faith, often demonstrating righteousness that surpasses that of the clergy, especially today. If we were to take the homeless from our streets and give them the teachings of Jesus Christ, along with a hot meal, and wean them off drugs, we can save their souls and their lives, along with bolstering our army's ranks."
 IKA_appalachian_tactics: "Appalachian Tactics"
 IKA_appalachian_tactics_desc: "The rugged mountains of Appalachia are difficult to traverse, making warfare painful and traditional tactics obsolete. But to those who call it home and our veterans, it is a treasure trove of secret passages and hiding spots. Guerrilla tactics could be learned here to help us turn the tide against the Feds and their puppetmasters."
 IKA_suffer_the_children: "Suffer the Children"
 IKA_suffer_the_children_desc: "It is regrettable to leave children fatherless, but this war demands that all men fulfill their sacred duty. For every father who leaves to fight, we shall care for their children with our ministers and pastors. If he is to die, the family will be given exemptions so they can survive without him. While God prefers children to have a father, we must accept the realities of our condition."
 IKA_salvation_through_service: "Salvation Through Service"
 IKA_salvation_through_service_desc: "Homosexuals are perhaps some of the most depraved sinners there are, next to the abortionists who kill the unborn. But while both were traditionally sent to conversion camps or killed, perhaps God could forgive some of them, provided they yield to biblical law and do not commit the unforgivable sin of rejecting Jesus Christ. They will fight in the Salvation Force, a special division composed of former sinners who seek God's forgiveness and overcome their sins."
 IKA_battlefield_nurses: "Battlefield Nurses"
 IKA_battlefield_nurses_desc: "Women have traditionally only served as nurses in our army, but perhaps even they could fight if necessary. While they will continue to tend to the wounded in battle, they shall also be allowed to shoot the armies of the Antichrist while doing so. Though they are not expected to primarily be in combat, they will not be condemned for it so long as they serve God."
 IKA_harness_the_christian_spirit: "Harness the Christian Spirit"
 IKA_harness_the_christian_spirit_desc: "The Christian is a servant of the Father, the Son, and the Holy Spirit. He fights for the Holy Trinity against the perversions of the world and Satan's forces. He knows his reward is Heaven and his actions are to save the souls of men. No fear shall he fear even as he walks through the valley of the shadow of death."
 IKA_station_wagon_forts: "Station Wagon Forts"
 IKA_station_wagon_forts_desc: "The Hussites of Bohemia, a group of proto-Protestants, managed to fight off massive Catholic armies with wagon forts. This provided cheap, mobile forts that they used to their advantage to fight off the immensely wealthy Papacy and the armies of Europe. In our time, cars such as station wagons can fulfill the same role."
 IKA_davids_army: "David's Army"
 IKA_davids_army_desc: "King David commanded a grand army for the Kingdom of Israel back when they followed God. He triumphed against the forces of King Saul, the Philistines, and even his own son. Much like David's army, our army will be a massive force of volunteers ready to defend our land against all kinds of enemies."
 IKA_lessons_from_the_feds: "Lessons from the Feds"
 IKA_lessons_from_the_feds_desc: "The federal government, the servants of Babylon and the New World Order, fought us with professional soldiers instead of warlord militias. They gave us painful lessons despite our victory. Much like them, we need to build a professional army that can stand toe-to-toe with the forces of Washington and Denver."
 IKA_modern_paladins: "Modern Paladins"
 IKA_modern_paladins_desc: "The Christian knights of Medieval Europe protected the faithful from the Islamic conquests from the Moors and the raids of the pagan Vikings. They were elite warriors who, while inferior in number, were able to turn the tide with their burning faith and win victory for Christendom. We are the knights of the modern era, fighting with the cross against Islam and Paganism."
 IKA_officer_seminary: "Officer Seminary"
 IKA_officer_seminary_desc: "Christian officers trained in spiritual warfare are among the most important people in our Army, serving as valuable mentors to recruits and veterans alike. Holy instruction is needed for our officers to recite scripture and to fight in key battles. Seminaries in our territory shall be established to teach our officers what war truly is."
 IKA_war_games: "War Games"
 IKA_war_games_desc: "Our officers and soldiers aren't up to par with those in Washington and Denver. They are just regular people who stood up for Jesus, but they need training. We will make war games part of mandatory training, both to improve our officers' skills and to turn our volunteers into soldiers."
 IKA_rod_of_iron: "Rod of Iron"
 IKA_rod_of_iron_desc: "Jesus is the Shepherd of All Nations, a powerful Christian warrior who seeks dominion over the entire Earth through the rod of iron. His judgment has been made inevitable by the recent war raging across America. And to any warlords and rival governments who resist, the rod of our Savior shall strike down those who dare to oppose God."
 IKA_ensure_theological_correctness: "Ensure Theological Correctness"
 IKA_ensure_theological_correctness_desc: "Some potential officers have shown they hold heretical views. We cannot allow our officers to believe in falsehoods. They shall be corrected any time they commit heresy and be rigorous in proclaiming Jesus Christ to be the Savior and Redeemer of the World."
 IKA_chariots_of_fire: "Chariots of Fire"
 IKA_chariots_of_fire_desc: "The prophet Elijah rode into battle against Baal on chariots of fire in defense of God and against all forms of pagan idolatry. He is a shining example of what all Christians must do when fighting against Satan and the Antichrist. Elijah's chariots of fire shall be applied to the production of our state-of-the-art tanks."
 IKA_rise_again: "Rise Again"
 IKA_rise_again_desc: "Why should we fear death? A true believing Christian should know that death is not the end, and that we will be resurrected at the Last Judgment. But if we are to live, then we will rise again to fight another day."
 IKA_gideons_army: "Gideon's Army"
 IKA_gideons_army_desc: "Gideon was a Judge in the Old Testament who was tasked with fighting the Midianites and their pagan rule over Israel. He was tasked with lowering his massive army to a small, elite force to fight with God's protection. God gave him the strategy of using shields to reflect torchlight and playing trumpets to create the appearance of a massive force. They won the battle and vanquished the Midianites. We shall do very much the same and use a relatively small but elite force to win."
 IKA_archangel_division: "Archangel Division"
 IKA_archangel_division_desc: "Aerial superiority is an important aspect of modern warfare, enabling the decimation of the enemy and secure control over key strategic areas. We know this lesson well and building up a formidable air force is a key military objective. Through our new air bases, we shall field a powerful air force of our own."
 IKA_a_wing_and_a_prayer: "A Wing and a Prayer"
 IKA_a_wing_and_a_prayer_desc: "With how outnumbered we are, we cannot afford losses. We must train our pilots to fly their planes to safety once critical damage is reached and to hang in there even when they are down to only one wing and a prayer."
 IKA_michaels_spear: "Michael's Spear"
 IKA_michaels_spear_desc: "We are the spear of the Archangel Michael, who leads God's Angelic Army. The air force, much like the angels, will soar above the battlefield and take down enemy planes threatening our ground forces. With some salvaging from old hangars and air force bases, we can scrounge up a force to fight back."
 IKA_gods_wrath: "God's Wrath"
 IKA_gods_wrath_desc: "Biden's New World Order thought they had a strong advantage over us. They thought that Christians were stupid and couldn't see through their schemes. They thought that by indoctrinating the Air Force, they could bomb us from the skies as they did to the Islamic terrorists of the Middle East. They were wrong! With many old pilots and mechanics on our side, we have built our own Air Force capable of turning the tide and finally delivering justice to the decadent elites living in their crystal palaces! God's wrath is here, and it's time for them to feel it!"
 IKA_organize_gods_army: "Organize God's Army"
 IKA_organize_gods_army_desc: "We are the Army of God, sent forth by His will to free America from Satan's grasp, whether from the atheistic Communists or the heathenous elites of the Federal Government. A day of reckoning is coming for this land. Much like the Union in the First Civil War, we will enact God's vengeance on America. And like the Union, we need to improve our generals. With a thorough training program and applying our lessons from the Civil War itself, we can become the greatest army in this sinful world, marching as Christian soldiers in His name."
 
 #Economy Focus Tree
 IKA_a_holy_economy: "A Holy Economy"
 IKA_a_holy_economy_desc: "The key to a godly society lies in the success of the holy economy, a system built on Christian principles in accordance with biblical law. The holy economy will also bring about fortune and pride to the people. This involves establishing a moral framework for responsible economic management to prevent the spread of materialism, overconsumption, and greed. The Holy Bible makes it clear that the economy must be moral and just to properly function. And we shall institute this system for America."
 
 #Starting National Spirits
 IKA_shall_we_gather: "Shall We Gather at the River?"
 IKA_shall_we_gather_desc: "Thanks to our recent resurgence, we have seen a large influx of recruits drawn from true-born Christians who have come here to serve us in this holy war. These recruits have formed cliques of their own within the Army, each with differing aims for creating a godly society. Some call for the Millennial Dawn, others seek to reaffirm the principle of One Nation Under God, and still others wish to bring about the Second Coming. Even if these cliques agree with us on the same goal, they are not entirely on the same page either. Such divides must be resolved quickly to preserve our unity and not just reforge America under our vision, but to overcome the influence of Satan and the Antichrist."
 IKA_military_dynamic: "Leaderless Resistance"
 IKA_military_dynamic_desc: "Since our organization came into existence in 1982, we have fought a war from the shadows against the ungodly and satanic federal government through a series of attacks on its most cherished institutions like the baby-murdering abortion clinics, using an effective model of warfare known as “leaderless resistance” wherein affiliated cells operate under our official backing without a central structure or leader to evade the authorities' grasp and fulfill God's mission.\n\nWith the government's power structures in complete collapse, our faithful cells and holy militias have emerged to take up arms to contribute to the cause in the national struggle. However, the current model is no longer needed as this war is now being fought on the blood-stained battlefields, and we must centralize our command to meet the challenges ahead of us as Christian soldiers."
 IKA_economy_dynamic: "Backwoods Economy"
 IKA_economy_dynamic_desc: "It is no secret that the Appalachians are a region where industry has been in decline, with its coal mines and manufacturing businesses going bankrupt and closing, as well as significant levels of poverty found among the populace, exacerbated further by the shortages in food or medicine caused by the Oil Crisis and the Second American Civil War. This economic decline threatens to impede the Army of God's war effort and its ability to produce enough equipment and supplies to sustain its forces in the long run. Thus, a revitalization and expansion of local industry in America's backwoods is necessary for the AOG to wage war and defeat its rivals."
 IKA_declining_religiosity: "Declining Religiosity"
 IKA_declining_religiosity_desc: "Since America’s founding, Christianity has played a significant role in its history and culture. Many consider themselves followers of God and Jesus Christ, and this land holds the distinct honor of being home to the world's largest Christian population.\n\nBut alas, the past few decades have not been kind to Christianity, as more and more Americans have turned away from God in favor of poisonous ideologies like secularism, atheism, and liberalism, resulting in church attendance plummeting and the percentage of believers falling. The influence of these ideologies has affected our numbers as we do not enjoy the same level of support as our opponents and face other issues such as a sizable majority of Christians not fully embracing our vision or internal disputes within our ranks between recruits and veterans, all of which must quickly remedied by converting as many true-born Christians as possible and crushing the sinners through force, just as our forefathers from biblical times had done before."
 
